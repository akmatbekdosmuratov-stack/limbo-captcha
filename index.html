<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMBO — Memory Game</title>

<style>
html,body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:monospace;
}

canvas {
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
}

#startScreen {
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:black;
    color:white;
    z-index:10;
}

button {
    padding:15px 30px;
    font-size:18px;
    cursor:pointer;
    border:none;
    background:white;
    color:black;
    border-radius:8px;
}

button:hover {
    background:gray;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="startScreen">
    <h1>LIMBO</h1>
    <button onclick="startGame()">START</button>
</div>

<audio id="bgm" loop>
    <source src="LIMBO.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const bgm = document.getElementById("bgm");
const startScreen = document.getElementById("startScreen");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function startGame(){
    // запуск музыки (работает в браузерах)
    bgm.volume = 0.6;
    bgm.currentTime = 0;

    bgm.play().catch(err => {
        console.log("Audio blocked:", err);
    });

    startScreen.style.display = "none";

    loop();
}

// простой визуальный фон (чтобы было видно что сайт живой)
function loop(){
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "20px monospace";
    ctx.fillText("LIMBO RUNNING...", 50, 50);

    requestAnimationFrame(loop);
}
</script>

</body>
</html>
