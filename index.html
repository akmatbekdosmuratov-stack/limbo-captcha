<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LIMBO Game</title>
    <style>
        body { margin: 0; background: #0a0a14; color: white; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #menu-overlay { position: absolute; z-index: 10; text-align: center; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: transparent; color: #fff; border: 1px solid #fff; margin: 10px; transition: 0.3s; }
        button:hover { background: #fff; color: #0a0a14; }
        canvas { display: block; }
        #status-left, #status-right, #center-msg { position: absolute; color: #fff; pointer-events: none; font-family: monospace; }
        #status-left { top: 20px; left: 20px; }
        #status-right { top: 20px; right: 20px; }
        #center-msg { bottom: 20px; width: 100%; text-align: center; font-size: 1.2em; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <h1>LIMBO</h1>
        <button id="btn-easy">EASY</button>
        <button id="btn-normal">NORMAL</button>
        <button id="btn-limbo">LIMBO</button>
    </div>

    <div id="status-left"></div>
    <div id="status-right"></div>
    <div id="center-msg"></div>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu-overlay');

        let W, H, game = { running: false, phase: 'menu', cells: [] };

        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W; canvas.height = H;
        }
        window.onresize = resize;
        resize();

        function startGame(mode) {
            menu.classList.add('hidden');
            game.running = true;
            game.phase = 'game';
            document.getElementById('center-msg').textContent = "РЕЖИМ: " + mode.toUpperCase();
            loop();
        }

        document.getElementById('btn-easy').onclick = () => startGame('easy');
        document.getElementById('btn-normal').onclick = () => startGame('normal');
        document.getElementById('btn-limbo').onclick = () => startGame('limbo');

        function loop() {
            if (!game.running) return;
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(0, 0, W, H);
            
            // Здесь будет отрисовка игры
            ctx.fillStyle = 'white';
            ctx.fillText("ИГРА ИДЕТ (нажми R для выхода)", 20, 20);
            
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'r' || e.key === 'R') {
                game.running = false;
                menu.classList.remove('hidden');
                document.getElementById('center-msg').textContent = "";
            }
        });
    </script>
</body>
</html>
