<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIMBO — Memory Game</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New',monospace; user-select:none; }
        body { display:flex; align-items:center; justify-content:center; }
        canvas { display:block; width:100vw; height:100vh; cursor:pointer; position:fixed; top:0; left:0; z-index:1; }

        #ui { position:fixed; inset:0; pointer-events:none; z-index:10; display:flex; flex-direction:column; justify-content:space-between; padding:10px; }
        #top,#bottom { display:flex; justify-content:space-between; align-items:center; gap:8px; }
        #bottom { align-items:flex-end; }
        .badge { 
            padding:7px 12px; 
            border:1px solid rgba(0,255,255,0.5); 
            background:rgba(0,0,0,0.85); 
            color:#0ff; font-size:10px; letter-spacing:2px; 
            text-shadow:0 0 10px rgba(0,255,255,0.7), 0 0 20px rgba(255,0,255,0.3);
            box-shadow:0 0 15px rgba(0,255,255,0.15), 0 0 30px rgba(255,0,255,0.08), inset 0 0 10px rgba(0,255,255,0.05);
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            backdrop-filter:blur(5px);
        }
        #center-msg { 
            position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); 
            pointer-events:none; z-index:10; 
            color:#fff; font-size:clamp(11px,2.2vw,18px); font-weight:bold; letter-spacing:4px; text-align:center; 
            text-shadow:0 0 20px rgba(0,255,255,1), 0 0 40px rgba(255,0,255,0.6), 0 0 80px rgba(0,255,255,0.4);
            padding:10px 20px; 
            border:2px solid rgba(0,255,255,0.5);
            background:rgba(0,0,0,0.8);
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
            box-shadow:0 0 30px rgba(0,255,255,0.3), 0 0 60px rgba(255,0,255,0.2), 0 0 100px rgba(0,255,255,0.1), inset 0 0 20px rgba(0,255,255,0.06);
            animation: msgPulse 2s ease-in-out infinite;
            white-space:nowrap;
        }
        @keyframes msgPulse {
            0%,100% { box-shadow:0 0 30px rgba(0,255,255,0.3), 0 0 60px rgba(255,0,255,0.2), 0 0 100px rgba(0,255,255,0.1), inset 0 0 20px rgba(0,255,255,0.06); }
            50% { box-shadow:0 0 50px rgba(0,255,255,0.5), 0 0 90px rgba(255,0,255,0.35), 0 0 140px rgba(0,255,255,0.2), inset 0 0 30px rgba(0,255,255,0.1); }
        }

        #menu-overlay { 
            position:fixed; inset:0; z-index:999; 
            display:flex; align-items:center; justify-content:center; 
            background:radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.96) 100%);
        }
        #menu-overlay::before {
            content:''; position:absolute; inset:0;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,255,0.04) 2px, rgba(0,255,255,0.04) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,0,255,0.03) 2px, rgba(255,0,255,0.03) 4px);
            pointer-events:none;
            animation:scanLines 8s linear infinite;
        }
        @keyframes scanLines {
            0% { background-position:0 0, 0 0; }
            100% { background-position:0 40px, 40px 0; }
        }
        #menu-overlay.hidden { display:none !important; }
        .menu-box { 
            width:90%; max-width:500px; padding:35px 30px; 
            border:2px solid rgba(0,255,255,0.5);
            background:linear-gradient(180deg, rgba(5,5,25,0.98), rgba(10,0,20,0.98), rgba(5,0,15,0.98));
            text-align:center; 
            box-shadow:0 0 100px rgba(0,255,255,0.25), 0 0 200px rgba(255,0,255,0.12), 0 0 40px rgba(0,255,255,0.15) inset;
            clip-path: polygon(30px 0, 100% 0, calc(100% - 30px) 100%, 0 100%);
            position:relative;
        }
        .menu-box::before {
            content:'';
            position:absolute;
            top:-3px; left:-3px; right:-3px; bottom:-3px;
            background:linear-gradient(45deg, #0ff, #f0f, #0ff, #f0f, #0ff);
            z-index:-1;
            clip-path: polygon(30px 0, 100% 0, calc(100% - 30px) 100%, 0 100%);
            animation:borderGlow 2s linear infinite;
            filter:blur(8px);
            opacity:0.7;
        }
        .menu-box::after {
            content:'';
            position:absolute;
            top:0; left:0; right:0; bottom:0;
            background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='none'/%3E%3Ccircle cx='30' cy='30' r='0.5' fill='rgba(0,255,255,0.1)'/%3E%3C/svg%3E");
            pointer-events:none;
            opacity:0.5;
        }
        @keyframes borderGlow {
            0% { filter:hue-rotate(0deg) blur(8px); }
            100% { filter:hue-rotate(360deg) blur(8px); }
        }
        .menu-box h1 { 
            color:#fff; font-size:clamp(36px,7vw,54px); letter-spacing:15px; margin-bottom:5px;
            text-shadow:0 0 25px rgba(0,255,255,0.8), 0 0 50px rgba(255,0,255,0.5), 0 0 100px rgba(0,255,255,0.4);
            position:relative;
        }
        .menu-box .sub { 
            color:#f0f; font-size:11px; letter-spacing:8px; margin-bottom:25px; 
            text-shadow:0 0 12px rgba(255,0,255,0.7), 0 0 25px rgba(255,0,255,0.4);
        }
        .menu-box .divider { 
            width:75%; height:2px; 
            background:linear-gradient(90deg, transparent, #0ff, #fff, #f0f, #fff, #0ff, transparent); 
            margin:0 auto 20px;
            box-shadow:0 0 15px rgba(0,255,255,0.6), 0 0 30px rgba(255,0,255,0.4);
        }
        .menu-box button { 
            display:block; width:100%; padding:14px 20px; margin:8px 0; 
            border:1px solid rgba(0,255,255,0.5); 
            background:linear-gradient(180deg, rgba(0,255,255,0.06), rgba(0,0,0,0.4), rgba(255,0,255,0.03)); 
            color:#0ff; font-family:inherit; font-size:14px; cursor:pointer; text-align:left; 
            transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
            position:relative; z-index:1000;
            letter-spacing:1px;
            box-shadow:0 0 10px rgba(0,255,255,0.1);
        }
        .menu-box button::after {
            content:'';
            position:absolute;
            top:0; left:0; right:0; bottom:0;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform:translateX(-100%);
            transition:transform 0.5s;
        }
        .menu-box button:hover::after {
            transform:translateX(100%);
        }
        .menu-box button:hover { 
            background:linear-gradient(180deg, rgba(0,255,255,0.15), rgba(0,0,0,0.3), rgba(255,0,255,0.08));
            border-color:#fff; 
            box-shadow:0 0 40px rgba(0,255,255,0.5), 0 0 80px rgba(255,0,255,0.3), 0 0 120px rgba(0,255,255,0.2);
            transform:translateY(-3px) scale(1.03);
            color:#fff;
        }
        .menu-box button:active {
            transform:scale(0.97);
            box-shadow:0 0 20px rgba(0,255,255,0.7);
            transition:all 0.1s;
        }
        .menu-box button b { display:block; margin-bottom:3px; color:#fff; font-size:16px; letter-spacing:2px; }
        .menu-box button span { display:block; font-size:10px; color:rgba(255,255,255,0.45); letter-spacing:1px; }
        .menu-box .hint { 
            margin-top:22px; 
            color:rgba(255,255,255,0.25); 
            font-size:9px; letter-spacing:4px;
            text-shadow:0 0 8px rgba(0,255,255,0.3);
        }

        /* Декоративные элементы на фоне */
        .bg-decor {
            position:fixed;
            pointer-events:none;
            z-index:2;
            border-radius:50%;
            animation:floatDecor 6s ease-in-out infinite;
        }
        @keyframes floatDecor {
            0%,100% { transform:translate(0, 0) rotate(0deg); opacity:0.4; }
            25% { transform:translate(15px, -20px) rotate(90deg); opacity:0.7; }
            50% { transform:translate(-10px, -5px) rotate(180deg); opacity:0.3; }
            75% { transform:translate(-20px, 15px) rotate(270deg); opacity:0.6; }
        }

        @media (max-width:600px) { 
            #ui { padding:6px; } 
            #top,#bottom { flex-direction:column; gap:4px; } 
            .badge { font-size:8px; padding:5px 8px; } 
            #center-msg { font-size:12px; padding:8px 12px; }
            .menu-box { padding:25px 15px; }
            .menu-box h1 { font-size:30px; letter-spacing:8px; }
        }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Декоративные элементы на фоне -->
<div class="bg-decor" style="top:8%; left:5%; width:80px; height:80px; border:1px solid rgba(0,255,255,0.2); animation-delay:0s;"></div>
<div class="bg-decor" style="top:15%; right:8%; width:60px; height:60px; border:1px solid rgba(255,0,255,0.2); animation-delay:-2s;"></div>
<div class="bg-decor" style="bottom:12%; left:10%; width:70px; height:70px; border:1px solid rgba(0,255,255,0.15); animation-delay:-4s;"></div>
<div class="bg-decor" style="bottom:20%; right:5%; width:50px; height:50px; border:1px solid rgba(255,0,255,0.25); animation-delay:-1s;"></div>

<!-- Диагональные линии -->
<div style="position:fixed; top:0; left:0; width:100%; height:100%; background:repeating-linear-gradient(45deg, transparent, transparent 50px, rgba(0,255,255,0.02) 50px, rgba(0,255,255,0.02) 51px), repeating-linear-gradient(-45deg, transparent, transparent 50px, rgba(255,0,255,0.02) 50px, rgba(255,0,255,0.02) 51px); z-index:2; pointer-events:none;"></div>

<!-- Угловые декорации -->
<div style="position:fixed; top:15px; left:15px; width:50px; height:50px; border-top:2px solid rgba(0,255,255,0.6); border-left:2px solid rgba(0,255,255,0.6); z-index:5; pointer-events:none; filter:drop-shadow(0 0 10px rgba(0,255,255,0.4));"></div>
<div style="position:fixed; top:15px; right:15px; width:50px; height:50px; border-top:2px solid rgba(255,0,255,0.6); border-right:2px solid rgba(255,0,255,0.6); z-index:5; pointer-events:none; filter:drop-shadow(0 0 10px rgba(255,0,255,0.4));"></div>
<div style="position:fixed; bottom:15px; left:15px; width:50px; height:50px; border-bottom:2px solid rgba(255,0,255,0.6); border-left:2px solid rgba(255,0,255,0.6); z-index:5; pointer-events:none; filter:drop-shadow(0 0 10px rgba(255,0,255,0.4));"></div>
<div style="position:fixed; bottom:15px; right:15px; width:50px; height:50px; border-bottom:2px solid rgba(0,255,255,0.6); border-right:2px solid rgba(0,255,255,0.6); z-index:5; pointer-events:none; filter:drop-shadow(0 0 10px rgba(0,255,255,0.4));"></div>

<!-- Точки по углам -->
<div style="position:fixed; top:35px; left:35px; width:6px; height:6px; background:#0ff; border-radius:50%; z-index:5; pointer-events:none; box-shadow:0 0 15px #0ff, 0 0 30px #0ff; animation:dotPulse 2s infinite;"></div>
<div style="position:fixed; top:35px; right:35px; width:6px; height:6px; background:#f0f; border-radius:50%; z-index:5; pointer-events:none; box-shadow:0 0 15px #f0f, 0 0 30px #f0f; animation:dotPulse 2s infinite 0.5s;"></div>
<div style="position:fixed; bottom:35px; left:35px; width:6px; height:6px; background:#f0f; border-radius:50%; z-index:5; pointer-events:none; box-shadow:0 0 15px #f0f, 0 0 30px #f0f; animation:dotPulse 2s infinite 1s;"></div>
<div style="position:fixed; bottom:35px; right:35px; width:6px; height:6px; background:#0ff; border-radius:50%; z-index:5; pointer-events:none; box-shadow:0 0 15px #0ff, 0 0 30px #0ff; animation:dotPulse 2s infinite 1.5s;"></div>
<style>
@keyframes dotPulse {
    0%,100% { transform:scale(1); opacity:1; }
    50% { transform:scale(2); opacity:0.3; }
}
</style>

<div id="ui">
    <div id="top">
        <div class="badge" id="status-left">◆ SYS:// OFFLINE</div>
        <div class="badge" id="status-right">◈ TIME:// 0.0s</div>
    </div>
    <div id="center-msg">⬡ LIMBO ⬡</div>
    <div id="bottom">
        <div class="badge" id="log-area">> READY</div>
        <div class="badge">⌨ R · SPACE · ESC</div>
    </div>
</div>

<div id="menu-overlay">
    <div class="menu-box">
        <h1>LIMBO</h1>
        <div class="sub">◆ MEMORY MODE ◆ 2×4 ◆</div>
        <div class="divider"></div>
        <button id="btn-easy">
            <b>🌸 ЛЁГКИЙ</b>
            <span>4.2с показ · 10с перемешивание · Очень медленная орбита</span>
        </button>
        <button id="btn-normal">
            <b>💜 НОРМАЛЬНЫЙ</b>
            <span>4.2с показ · 10с перемешивание · Медленная орбита</span>
        </button>
        <button id="btn-limbo">
            <b>⬜ LIMBO</b>
            <span>4.2с показ · 10с перемешивание · Средняя орбита</span>
        </button>
        <div class="hint">[ ВЫБЕРИ СЛОЖНОСТЬ ]</div>
    </div>
</div>

<audio id="bgm" preload="auto">
    <source src="LIMBO.mp3" type="audio/mpeg">
</audio>

<script>
(function() {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menu-overlay');
    const statusLeft = document.getElementById('status-left');
    const statusRight = document.getElementById('status-right');
    const centerMsg = document.getElementById('center-msg');
    const logArea = document.getElementById('log-area');
    const bgm = document.getElementById('bgm');

    const btnEasy = document.getElementById('btn-easy');
    const btnNormal = document.getElementById('btn-normal');
    const btnLimbo = document.getElementById('btn-limbo');

    let W, H;

    const CONFIG = {
        easy:   { name:'ЛЁГКИЙ',    reveal:4200, shuffle:10000, beat:500, orbit:0.005, trans:2000 },
        normal: { name:'НОРМАЛЬНЫЙ', reveal:4200, shuffle:10000, beat:350, orbit:0.008, trans:1800 },
        limbo:  { name:'LIMBO',     reveal:4200, shuffle:10000, beat:200, orbit:0.012, trans:1500 }
    };

    const THEMES = {
        easy: {
            bg:'#0a0008', cellBg:'rgba(255,105,180,0.12)', cellEdge:'rgba(255,105,180,0.85)',
            correctBg:'rgba(255,20,147,0.4)', correctEdge:'rgba(255,20,147,1)',
            wrongBg:'rgba(255,0,64,0.5)', wrongEdge:'rgba(255,0,64,1)',
            scanColor:'rgba(255,105,180,0.35)', ringColor:'rgba(255,105,180,0.45)',
            starColor:'rgba(255,160,200,', hudText:'#FF69B4', accent:'#FF1493',
            gridColor:'rgba(255,105,180,0.04)'
        },
        normal: {
            bg:'#020015', cellBg:'rgba(0,245,255,0.1)', cellEdge:'rgba(0,245,255,0.85)',
            correctBg:'rgba(57,255,20,0.4)', correctEdge:'rgba(57,255,20,1)',
            wrongBg:'rgba(255,0,64,0.5)', wrongEdge:'rgba(255,0,64,1)',
            scanColor:'rgba(0,255,255,0.35)', ringColor:'rgba(0,255,255,0.45)',
            starColor:'rgba(150,220,255,', hudText:'#00FFFF', accent:'#00FFFF',
            gridColor:'rgba(0,255,255,0.04)'
        },
        limbo: {
            bg:'#050505', cellBg:'rgba(200,200,200,0.1)', cellEdge:'rgba(200,200,200,0.85)',
            correctBg:'rgba(255,255,255,0.35)', correctEdge:'rgba(255,255,255,1)',
            wrongBg:'rgba(220,30,30,0.5)', wrongEdge:'rgba(255,50,50,1)',
            scanColor:'rgba(180,180,180,0.35)', ringColor:'rgba(180,180,180,0.45)',
            starColor:'rgba(200,200,200,', hudText:'#CCCCCC', accent:'#FFFFFF',
            gridColor:'rgba(255,255,255,0.04)'
        }
    };

    let theme = THEMES.normal;
    let gameStarted = false;

    const S = {
        cfg: CONFIG.normal, phase:'menu', running:false, paused:false,
        cells:[], correctId:null, gridPos:[], tStart:0, tPhase:0, tShuffle:0,
        orbitAngle:0, particles:[], stars:[], scanY:0, shake:0, scanLines:[],
        animId:null, swapTimer:null, boardRX:0, boardRY:0, hexagons:[], diamonds:[], triangles:[]
    };

    btnEasy.addEventListener('click', (e) => { e.stopPropagation(); startGame('easy'); });
    btnNormal.addEventListener('click', (e) => { e.stopPropagation(); startGame('normal'); });
    btnLimbo.addEventListener('click', (e) => { e.stopPropagation(); startGame('limbo'); });

    function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W; canvas.height = H;
        
        const cols=2, rows=4;
        const tileW = Math.min(120, Math.max(70, W*0.12));
        const tileH = tileW * 0.85;
        const gapX = Math.max(25, tileW*0.35);
        const gapY = Math.max(15, tileH*0.2);
        const bw = cols*tileW + (cols-1)*gapX;
        const bh = rows*tileH + (rows-1)*gapY;
        const bx = (W-bw)/2, by = (H-bh)/2;
        
        S.gridPos = [];
        for(let r=0; r<rows; r++)
            for(let c=0; c<cols; c++)
                S.gridPos.push({x:bx+c*(tileW+gapX), y:by+r*(tileH+gapY), w:tileW, h:tileH});
        
        S.boardRX = Math.min(W,H)*0.38;
        S.boardRY = Math.min(W,H)*0.22;
        
        if(S.cells.length) for(let i=0; i<S.cells.length; i++) { 
            S.cells[i].w=S.gridPos[i].w; S.cells[i].h=S.gridPos[i].h; 
        }
        
        if(!S.stars.length || S.stars.length<100) {
            S.stars=[];
            for(let i=0; i<150; i++) S.stars.push({
                x:Math.random()*W, y:Math.random()*H, 
                r:Math.random()*2.5+0.3, a:Math.random()*0.9+0.1, 
                sp:Math.random()*0.05+0.003, ph:Math.random()*Math.PI*2
            });
        }
        
        S.scanLines = [];
        for(let i=0; i<10; i++) S.scanLines.push({
            y:Math.random()*H, speed:0.15+Math.random()*3.5, alpha:0.015+Math.random()*0.08
        });
        
        S.hexagons = [];
        for(let i=0; i<22; i++) S.hexagons.push({
            x:Math.random()*W, y:Math.random()*H,
            size:8+Math.random()*28, angle:Math.random()*Math.PI*2,
            speed:0.001+Math.random()*0.012, alpha:0.02+Math.random()*0.1
        });
        
        S.diamonds = [];
        for(let i=0; i<16; i++) S.diamonds.push({
            x:Math.random()*W, y:Math.random()*H,
            size:5+Math.random()*16, angle:Math.random()*Math.PI*2,
            speed:0.003+Math.random()*0.018, alpha:0.03+Math.random()*0.12
        });

        S.triangles = [];
        for(let i=0; i<14; i++) S.triangles.push({
            x:Math.random()*W, y:Math.random()*H,
            size:7+Math.random()*18, angle:Math.random()*Math.PI*2,
            speed:0.002+Math.random()*0.014, alpha:0.02+Math.random()*0.09
        });
    }
    window.addEventListener('resize', resize);

    function log(msg) {
        const lines = logArea.innerHTML.split('<br>');
        lines.push('> '+msg);
        if(lines.length>3) lines.shift();
        logArea.innerHTML = lines.join('<br>');
    }

    function setStatus(l,r,m) {
        statusLeft.textContent=l; statusRight.textContent=r;
        if(m!==undefined) centerMsg.textContent=m;
    }

    function createCells() {
        S.cells=[];
        for(let i=0; i<8; i++) {
            const g=S.gridPos[i];
            S.cells.push({
                id:i, x:g.x, y:g.y, w:g.w, h:g.h, 
                color:theme.cellBg, edge:theme.cellEdge, isCorrect:false, glowPhase:Math.random()*Math.PI*2
            });
        }
        const correctIdx = Math.floor(Math.random()*8);
        S.correctId = S.cells[correctIdx].id;
        S.cells[correctIdx].isCorrect = true;
        S.cells[correctIdx].color = theme.correctBg;
        S.cells[correctIdx].edge = theme.correctEdge;
    }

    function showCorrect(show) {
        S.cells.forEach(c => {
            if(c.isCorrect && show) { c.color = theme.correctBg; c.edge = theme.correctEdge; }
            else if(!c.isCorrect || !show) { c.color = theme.cellBg; c.edge = theme.cellEdge; }
        });
        if(!show) {
            const correctCell = S.cells.find(c => c.isCorrect);
            if(correctCell) { correctCell.color = theme.cellBg; correctCell.edge = theme.cellEdge; }
        }
    }

    function resetCellsToGrid() {
        S.cells.forEach((c,i)=>{ const g=S.gridPos[i]; c.x=g.x; c.y=g.y; });
    }

    function startGame(mode) {
        if(gameStarted) return;
        gameStarted = true;
        
        S.cfg=CONFIG[mode]; theme=THEMES[mode]; S.phase='reveal'; S.running=true; S.paused=false;
        S.particles=[]; S.shake=0; S.scanY=0; S.orbitAngle=0;
        clearTimeout(S.swapTimer);
        resize(); createCells(); resetCellsToGrid();
        S.tStart=performance.now(); S.tPhase=S.tStart;
        
        menuOverlay.classList.add('hidden');
        setStatus('◆ SYS:// ONLINE','◈ TIME:// 0.0s','⬡ ЗАПОМНИ ЯЧЕЙКУ ⬡');
        log('BOOT '+S.cfg.name);
        try { bgm.currentTime=185; bgm.volume=0.55; bgm.play().catch(()=>{}); } catch(e){}
        if(!S.animId) S.animId=requestAnimationFrame(loop);
    }

    function scheduleSwap() {
        if(S.phase!=='shuffle') return;
        const now=performance.now();
        if(!S.tShuffle) S.tShuffle=now;
        if(now-S.tShuffle >= S.cfg.shuffle) {
            S.phase='trans'; S.tPhase=now; S.orbitAngle=0;
            setStatus('◆ SYS:// TRANSITION','◈ TIME:// '+((now-S.tStart)/1000).toFixed(1)+'s','⬡ ФОРМИРОВАНИЕ ОРБИТЫ ⬡');
            log('ORBIT TRANSITION');
            return;
        }
        const a=Math.floor(Math.random()*8); let b=Math.floor(Math.random()*8);
        while(b===a) b=Math.floor(Math.random()*8);
        animateSwap(a,b,Math.max(80,S.cfg.beat*0.7));
        S.swapTimer=setTimeout(scheduleSwap,S.cfg.beat);
    }

    function animateSwap(i,j,dur) {
        const c1=S.cells[i], c2=S.cells[j], x1=c1.x, y1=c1.y, x2=c2.x, y2=c2.y, start=performance.now();
        function step(now) {
            const p=Math.min(1,(now-start)/dur), e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
            c1.x=x1+(x2-x1)*e; c1.y=y1+(y2-y1)*e; c2.x=x2+(x1-x2)*e; c2.y=y2+(y1-y2)*e;
            if(p<1) requestAnimationFrame(step); 
            else { [S.cells[i], S.cells[j]] = [S.cells[j], S.cells[i]]; c1.x=x2; c1.y=y2; c2.x=x1; c2.y=y1; }
        }
        requestAnimationFrame(step);
    }

    function getOrbitPos(i,angle) {
        const cx=W/2, cy=H/2, a=angle+i*Math.PI*2/8;
        return {x:cx+Math.cos(a)*S.boardRX-S.cells[i].w/2, y:cy+Math.sin(a)*S.boardRY-S.cells[i].h/2};
    }

    function updateTransition(now) {
        const p=Math.min(1,(now-S.tPhase)/S.cfg.trans), e=1-Math.pow(1-p,3);
        S.cells.forEach((c,i)=>{ const g=S.gridPos[i], o=getOrbitPos(i,S.orbitAngle); c.x=g.x+(o.x-g.x)*e; c.y=g.y+(o.y-g.y)*e; });
        if(p>=1) {
            S.phase='orbit'; S.tPhase=now;
            setStatus('◆ SYS:// AWAITING INPUT','◈ TIME:// '+((now-S.tStart)/1000).toFixed(1)+'s','⬡ ВЫБИРАЙ! ⬡');
            log('ORBIT ACTIVE'); spawnBurst(45);
        }
    }

    function updateOrbit() {
        S.orbitAngle+=S.cfg.orbit;
        S.cells.forEach((c,i)=>{ const o=getOrbitPos(i,S.orbitAngle); c.x=o.x; c.y=o.y; });
    }

    canvas.addEventListener('click',function(e) {
        if(!gameStarted||S.phase!=='orbit'||!S.running||S.paused) return;
        const rect=canvas.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
        for(let i=0; i<S.cells.length; i++) {
            const c=S.cells[i];
            if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h) { handlePick(c); return; }
        }
    });

    function handlePick(clickedCell) {
        S.phase='result';
        const correct = clickedCell.id === S.correctId;
        if(correct) {
            clickedCell.color = theme.correctBg; clickedCell.edge = theme.correctEdge;
            centerMsg.textContent = '✔ ДОСТУП РАЗРЕШЁН ✔'; centerMsg.style.color = theme.correctEdge;
            centerMsg.style.textShadow = '0 0 40px '+theme.correctEdge+', 0 0 80px '+theme.correctEdge;
            log('CORRECT!'); S.shake=6; spawnBurst(60);
        } else {
            clickedCell.color = theme.wrongBg; clickedCell.edge = theme.wrongEdge;
            const correctCell = S.cells.find(c => c.id === S.correctId);
            if(correctCell) { correctCell.color = theme.correctBg; correctCell.edge = theme.correctEdge; }
            centerMsg.textContent = '💀 ДОСТУП ЗАПРЕЩЁН 💀'; centerMsg.style.color = theme.wrongEdge;
            centerMsg.style.textShadow = '0 0 40px '+theme.wrongEdge+', 0 0 80px '+theme.wrongEdge;
            log('WRONG!'); S.shake=16; spawnBurst(30);
        }
    }

    function spawnBurst(n) {
        const cx=W/2, cy=H/2;
        for(let i=0; i<n; i++) {
            const a=Math.random()*Math.PI*2, s=1.5+Math.random()*4;
            S.particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:25+Math.random()*30,size:1.5+Math.random()*4,col:Math.random()<0.5?'rgba(0,255,255,':'rgba(255,0,255,'});
        }
    }

    function spawnAmbient() {
        if(Math.random()>0.25) return;
        S.particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,life:0,max:60+Math.random()*100,size:0.4+Math.random()*2.5,col:Math.random()<0.5?'rgba(0,255,255,':'rgba(255,0,255,'});
    }

    function updateParticles() {
        for(let i=S.particles.length-1; i>=0; i--) {
            const p=S.particles[i]; p.x+=p.vx; p.y+=p.vy; p.life++; p.vx*=0.993; p.vy*=0.993;
            if(p.life>=p.max) S.particles.splice(i,1);
        }
        spawnAmbient();
    }

    function drawBackground(now) {
        const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.85);
        bgGrad.addColorStop(0, theme.bg); bgGrad.addColorStop(1, '#000000');
        ctx.fillStyle = bgGrad; ctx.fillRect(0,0,W,H);
        
        // Сетка
        ctx.strokeStyle = theme.gridColor; ctx.lineWidth = 0.8;
        const step = 35; ctx.beginPath();
        for(let x=0; x<W; x+=step) { ctx.moveTo(x,0); ctx.lineTo(x,H); }
        for(let y=0; y<H; y+=step) { ctx.moveTo(0,y); ctx.lineTo(W,y); }
        ctx.stroke();

        // Диагональная сетка
        ctx.strokeStyle = theme.gridColor; ctx.globalAlpha = 0.5;
        const dStep = 50; ctx.beginPath();
        for(let d=-H; d<W+H; d+=dStep) { ctx.moveTo(d,0); ctx.lineTo(d-H,H); }
        for(let d=0; d<W+H; d+=dStep) { ctx.moveTo(d,0); ctx.lineTo(d-H,H); }
        ctx.stroke(); ctx.globalAlpha = 1;
        
        // Звёзды
        for(const s of S.stars) {
            const a=(Math.sin(now*s.sp+s.ph)+1)/2*s.a;
            ctx.fillStyle = theme.starColor + Math.max(0.04,a).toFixed(3)+')';
            ctx.beginPath();
            if(s.r>2.2) {
                const sz=s.r*0.7;
                ctx.moveTo(s.x,s.y-sz); ctx.lineTo(s.x+sz*0.35,s.y-sz*0.35);
                ctx.lineTo(s.x+sz,s.y); ctx.lineTo(s.x+sz*0.35,s.y+sz*0.35);
                ctx.lineTo(s.x,s.y+sz); ctx.lineTo(s.x-sz*0.35,s.y+sz*0.35);
                ctx.lineTo(s.x-sz,s.y); ctx.lineTo(s.x-sz*0.35,s.y-sz*0.35);
                ctx.closePath();
            } else if(s.r>1.5) {
                ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            } else {
                ctx.fillRect(s.x,s.y,1.5,1.5);
            }
            ctx.fill();
        }
        
        // Гексагоны
        for(const h of S.hexagons) {
            h.angle += h.speed;
            ctx.save(); ctx.globalAlpha = h.alpha;
            ctx.strokeStyle = theme.accent; ctx.lineWidth = 1;
            ctx.shadowBlur = 6; ctx.shadowColor = theme.accent;
            ctx.beginPath();
            for(let j=0; j<6; j++) {
                const a = h.angle + j*Math.PI/3;
                const px = h.x + h.size*Math.cos(a), py = h.y + h.size*Math.sin(a);
                j===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
            }
            ctx.closePath(); ctx.stroke();
            ctx.restore();
        }
        
        // Ромбы
        for(const d of S.diamonds) {
            d.angle += d.speed;
            ctx.save(); ctx.globalAlpha = d.alpha;
            ctx.strokeStyle = theme.hudText; ctx.lineWidth = 0.8;
            ctx.shadowBlur = 4; ctx.shadowColor = theme.hudText;
            ctx.beginPath();
            for(let j=0; j<4; j++) {
                const a = d.angle + j*Math.PI/2;
                const px = d.x + d.size*Math.cos(a), py = d.y + d.size*Math.sin(a);
                j===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
            }
            ctx.closePath(); ctx.stroke();
            ctx.restore();
        }

        // Треугольники
        for(const tr of S.triangles) {
            tr.angle += tr.speed;
            ctx.save(); ctx.globalAlpha = tr.alpha;
            ctx.strokeStyle = theme.accent; ctx.lineWidth = 0.6;
            ctx.beginPath();
            for(let j=0; j<3; j++) {
                const a = tr.angle + j*Math.PI*2/3;
                const px = tr.x + tr.size*Math.cos(a), py = tr.y + tr.size*Math.sin(a);
                j===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
            }
            ctx.closePath(); ctx.stroke();
            ctx.restore();
        }
        
        // Скан-линии
        for(const sl of S.scanLines) {
            sl.y += sl.speed; if(sl.y > H+20) sl.y = -20;
            const slGrad = ctx.createLinearGradient(0, sl.y-15, 0, sl.y+15);
            slGrad.addColorStop(0, 'transparent'); slGrad.addColorStop(0.5, theme.scanColor); slGrad.addColorStop(1, 'transparent');
            ctx.strokeStyle = slGrad; ctx.globalAlpha = sl.alpha; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, sl.y); ctx.lineTo(W, sl.y); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        
        // Главная скан-линия
        S.scanY = (S.scanY+1.4)%H;
        const scanGrad = ctx.createLinearGradient(0, S.scanY-25, 0, S.scanY+25);
        scanGrad.addColorStop(0, 'transparent'); scanGrad.addColorStop(0.5, theme.scanColor); scanGrad.addColorStop(1, 'transparent');
        ctx.strokeStyle = scanGrad; ctx.lineWidth = 3; ctx.shadowBlur = 8; ctx.shadowColor = theme.accent;
        ctx.beginPath(); ctx.moveTo(0, S.scanY); ctx.lineTo(W, S.scanY); ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function drawOrbitRings(now) {
        const cx=W/2, cy=H/2, p=1+Math.sin(now*0.0025)*0.05;
        ctx.save(); 
        
        // Внешнее кольцо
        ctx.globalAlpha=0.3; ctx.strokeStyle=theme.ringColor; ctx.lineWidth=2;
        ctx.shadowBlur = 10; ctx.shadowColor = theme.accent;
        ctx.setLineDash([8, 16]);
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*p,S.boardRY*p,0,0,Math.PI*2); ctx.stroke();
        ctx.shadowBlur = 0;
        
        // Среднее кольцо
        ctx.setLineDash([4, 20]); ctx.globalAlpha=0.22;
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*0.7*p,S.boardRY*0.7*p,0,0,Math.PI*2); ctx.stroke();
        
        // Внутреннее кольцо
        ctx.setLineDash([]); ctx.globalAlpha=0.15;
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*0.4*p,S.boardRY*0.4*p,0,0,Math.PI*2); ctx.stroke();
        
        // Прицел
        const cs = 18 + Math.sin(now*0.004)*6;
        ctx.globalAlpha = 0.45; ctx.strokeStyle = theme.hudText; ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 7]);
        ctx.beginPath();
        ctx.moveTo(cx-cs, cy); ctx.lineTo(cx+cs, cy);
        ctx.moveTo(cx, cy-cs); ctx.lineTo(cx, cy+cs);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Центральная точка
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2);
        ctx.fillStyle = theme.accent; ctx.globalAlpha = 0.7;
        ctx.shadowBlur = 12; ctx.shadowColor = theme.accent;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.restore();
    }

    function drawCells() {
        for(const c of S.cells) {
            ctx.save();
            
            const glowPulse = 1 + Math.sin(performance.now()*0.004 + c.glowPhase)*0.15;
            const glowSize = 22 * glowPulse;
            
            ctx.shadowBlur = glowSize;
            ctx.shadowColor = c.edge;
            
            ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(c.x+4, c.y+4, c.w, c.h);
            ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, c.w, c.h);
            
            ctx.shadowBlur = 0;
            ctx.strokeStyle = c.edge; ctx.lineWidth = 2.5; ctx.strokeRect(c.x, c.y, c.w, c.h);
            
            // Двойная внутренняя рамка
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 0.8;
            ctx.strokeRect(c.x+4, c.y+4, c.w-8, c.h-8);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 0.5;
            ctx.strokeRect(c.x+7, c.y+7, c.w-14, c.h-14);
            
            const grad = ctx.createLinearGradient(c.x, c.y, c.x, c.y+c.h);
            grad.addColorStop(0, 'rgba(255,255,255,0.1)'); grad.addColorStop(0.45, 'rgba(255,255,255,0.02)'); grad.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = grad; ctx.fillRect(c.x, c.y, c.w, c.h);
            
            // Уголки
            const cs2 = 7;
            ctx.strokeStyle = c.edge; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(c.x, c.y+cs2); ctx.lineTo(c.x, c.y); ctx.lineTo(c.x+cs2, c.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x+c.w-cs2, c.y); ctx.lineTo(c.x+c.w, c.y); ctx.lineTo(c.x+c.w, c.y+cs2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x, c.y+c.h-cs2); ctx.lineTo(c.x, c.y+c.h); ctx.lineTo(c.x+cs2, c.y+c.h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x+c.w-cs2, c.y+c.h); ctx.lineTo(c.x+c.w, c.y+c.h); ctx.lineTo(c.x+c.w, c.y+c.h-cs2); ctx.stroke();
            
            ctx.restore();
        }
    }

    function drawParticles() {
        for(const p of S.particles) {
            const a = 1-p.life/p.max;
            ctx.save(); ctx.globalAlpha = Math.max(0, a);
            ctx.fillStyle = p.col + (a*0.95).toFixed(3)+')';
            ctx.shadowBlur = 8; ctx.shadowColor = p.col+'0.5)';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }
    }

    function drawHUD(now) {
        if(S.phase==='orbit'||S.phase==='trans'||S.phase==='shuffle') {
            const pulse = 0.5+0.5*Math.sin(now*0.0035);
            ctx.save();
            ctx.globalAlpha = 0.12+pulse*0.14;
            ctx.fillStyle = theme.hudText;
            ctx.font = 'bold '+Math.min(46,Math.max(24,W*0.035))+'px "Courier New"';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 18; ctx.shadowColor = theme.accent;
            ctx.fillText('L I M B O', W/2, H/2+6);
            ctx.restore();
        }
        canvas.style.transform = S.shake>0.1 ? `translate(${(Math.random()-0.5)*S.shake}px,${(Math.random()-0.5)*S.shake}px)` : 'translate(0,0)';
    }

    function loop(now) {
        if(!S.running) { drawBackground(now); updateParticles(); drawParticles(); S.animId = requestAnimationFrame(loop); return; }
        if(!S.paused) {
            const elapsed = (now-S.tStart)/1000;
            if(S.phase==='reveal'&&now-S.tPhase>=S.cfg.reveal) {
                S.phase='shuffle'; S.tPhase=now; S.tShuffle=0; showCorrect(false);
                setStatus('◆ SYS:// SHUFFLING','◈ TIME:// '+elapsed.toFixed(1)+'s','⬡ ПЕРЕМЕШИВАНИЕ ⬡'); log('SHUFFLE START'); scheduleSwap();
            }
            if(S.phase==='trans') updateTransition(now);
            if(S.phase==='orbit') updateOrbit();
            if(S.shake>0.1) S.shake*=0.88; else S.shake=0;
            updateParticles();
            drawBackground(now); drawOrbitRings(now); drawCells(); drawParticles(); drawHUD(now);
            setStatus(S.phase==='result'?'◆ SYS:// RESULT':'◆ SYS:// ONLINE','◈ TIME:// '+elapsed.toFixed(1)+'s');
        }
        S.animId = requestAnimationFrame(loop);
    }

    window.addEventListener('keydown',function(e) {
        if(e.key==='Escape') { if(document.fullscreenElement) document.exitFullscreen(); return; }
        if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К') { restart(); return; }
        if(e.key===' ') { e.preventDefault(); S.paused=!S.paused; if(S.paused) { bgm.pause(); log('PAUSED'); } else { bgm.play().catch(()=>{}); log('RESUMED'); } }
    });

    function restart() {
        gameStarted = false; S.running=false; S.phase='menu'; S.particles=[]; S.shake=0;
        clearTimeout(S.swapTimer); bgm.pause(); bgm.currentTime=185;
        menuOverlay.classList.remove('hidden');
        setStatus('◆ SYS:// OFFLINE','◈ TIME:// 0.0s','⬡ LIMBO ⬡'); log('RESTART');
        canvas.style.transform='translate(0,0)';
    }

    resize(); setStatus('◆ SYS:// OFFLINE','◈ TIME:// 0.0s','⬡ LIMBO ⬡'); log('READY');
    S.animId = requestAnimationFrame(loop);
})();
</script>
