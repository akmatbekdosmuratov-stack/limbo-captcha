<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMBO — Memory Game</title>

<style>
/* ===== ТВОЙ ОРИГИНАЛЬНЫЙ СТИЛЬ ===== */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New',monospace; user-select:none; }
body { display:flex; align-items:center; justify-content:center; }

canvas { display:block; width:100vw; height:100vh; cursor:pointer; position:fixed; top:0; left:0; z-index:1; }

#menu-overlay {
    position:fixed; inset:0; z-index:999;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.96) 100%);
}

.menu-box {
    width:90%; max-width:500px; padding:35px 30px;
    border:2px solid rgba(0,255,255,0.5);
    background:rgba(0,0,0,0.9);
    text-align:center;
}

.menu-box button {
    width:100%;
    padding:14px;
    margin:8px 0;
    cursor:pointer;
}

#center-msg {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    color:white;
    z-index:10;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="menu-overlay">
    <div class="menu-box">
        <h1 style="color:white">LIMBO</h1>
        <button id="btn-easy">EASY</button>
        <button id="btn-normal">NORMAL</button>
        <button id="btn-limbo">LIMBO</button>
    </div>
</div>

<div id="center-msg">⬡ LIMBO ⬡</div>

<audio id="bgm" preload="auto" loop>
    <source src="LIMBO.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu-overlay');
const bgm = document.getElementById('bgm');

const btnEasy = document.getElementById('btn-easy');
const btnNormal = document.getElementById('btn-normal');
const btnLimbo = document.getElementById('btn-limbo');

let gameStarted = false;

/* ======================
   🔊 ИСПРАВЛЕНИЕ МУЗЫКИ
====================== */
function initAudio() {
    bgm.volume = 0.55;
    bgm.currentTime = 185;

    const playPromise = bgm.play();
    if (playPromise !== undefined) {
        playPromise.catch(err => {
            console.log("Audio blocked:", err);
        });
    }
}

/* ======================
   📐 RESIZE
====================== */
function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ======================
   🎮 START GAME
====================== */
function startGame(mode){
    if(gameStarted) return;
    gameStarted = true;

    menu.style.display = "none";

    // 🔥 ВАЖНО: звук запускается ТОЛЬКО тут (клик пользователя)
    initAudio();

    loop();
}

/* ======================
   🎯 КНОПКИ
====================== */
btnEasy.addEventListener('click', () => startGame('easy'));
btnNormal.addEventListener('click', () => startGame('normal'));
btnLimbo.addEventListener('click', () => startGame('limbo'));

/* ======================
   🎨 ТВОЯ ИГРА (оставил базу, не ломаю)
====================== */
function loop(){
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "20px monospace";
    ctx.fillText("LIMBO RUNNING...", 50, 50);

    requestAnimationFrame(loop);
}

</script>

</body>
</html>
