<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIMBO — Memory Game</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New',monospace; user-select:none; }
        body { display:flex; align-items:center; justify-content:center; }
        canvas { display:block; width:100vw; height:100vh; cursor:pointer; position:fixed; top:0; left:0; z-index:1; }

        #ui { position:fixed; inset:0; pointer-events:none; z-index:10; display:flex; flex-direction:column; justify-content:space-between; padding:10px; }
        #top,#bottom { display:flex; justify-content:space-between; align-items:center; gap:8px; }
        #bottom { align-items:flex-end; }
        .badge { 
            padding:7px 12px; 
            border:1px solid rgba(255,255,255,0.3); 
            background:rgba(0,0,0,0.75); 
            color:#fff; font-size:10px; letter-spacing:2px; 
            text-shadow:0 0 10px rgba(255,255,255,0.5);
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            backdrop-filter:blur(5px);
            transition:all 0.5s;
        }
        #center-msg { 
            position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); 
            pointer-events:none; z-index:10; 
            color:#fff; font-size:clamp(11px,2.2vw,18px); font-weight:bold; letter-spacing:4px; text-align:center; 
            text-shadow:0 0 20px rgba(255,255,255,0.8);
            padding:10px 20px; 
            border:2px solid rgba(255,255,255,0.4);
            background:rgba(0,0,0,0.7);
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
            transition:all 0.5s;
            white-space:nowrap;
        }
        @keyframes msgPulse {
            0%,100% { box-shadow:0 0 20px rgba(255,255,255,0.3); }
            50% { box-shadow:0 0 40px rgba(255,255,255,0.5); }
        }

        #menu-overlay { 
            position:fixed; inset:0; z-index:999; 
            display:flex; align-items:center; justify-content:center; 
            background:radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%);
            transition:all 0.5s;
        }
        #menu-overlay.hidden { display:none !important; }
        .menu-box { 
            width:90%; max-width:500px; padding:35px 30px; 
            border:2px solid rgba(255,255,255,0.3);
            background:rgba(10,10,20,0.95);
            text-align:center; 
            box-shadow:0 0 60px rgba(255,255,255,0.15);
            clip-path: polygon(30px 0, 100% 0, calc(100% - 30px) 100%, 0 100%);
            position:relative;
            transition:all 0.5s;
        }
        .menu-box h1 { 
            color:#fff; font-size:clamp(36px,7vw,54px); letter-spacing:15px; margin-bottom:5px;
            text-shadow:0 0 25px rgba(255,255,255,0.8);
            transition:all 0.5s;
        }
        .menu-box .sub { 
            color:#aaa; font-size:11px; letter-spacing:8px; margin-bottom:25px; 
            transition:all 0.5s;
        }
        .menu-box .divider { 
            width:75%; height:2px; 
            background:linear-gradient(90deg, transparent, #fff, #aaa, transparent); 
            margin:0 auto 20px;
            transition:all 0.5s;
        }
        .menu-box button { 
            display:block; width:100%; padding:14px 20px; margin:8px 0; 
            border:1px solid rgba(255,255,255,0.3); 
            background:rgba(0,0,0,0.4); 
            color:#fff; font-family:inherit; font-size:14px; cursor:pointer; text-align:left; 
            transition:all 0.3s;
            clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
            position:relative; z-index:1000;
            letter-spacing:1px;
        }
        .menu-box button:hover { 
            background:rgba(255,255,255,0.1);
            border-color:#fff; 
            box-shadow:0 0 30px rgba(255,255,255,0.3);
            transform:translateY(-3px);
        }
        .menu-box button b { display:block; margin-bottom:3px; color:#fff; font-size:16px; }
        .menu-box button span { display:block; font-size:10px; color:rgba(255,255,255,0.5); }
        .menu-box .hint { margin-top:22px; color:rgba(255,255,255,0.3); font-size:9px; letter-spacing:4px; }

        /* Кнопка easy */
        #btn-easy { border-color:rgba(100,200,255,0.5); }
        #btn-easy:hover { background:rgba(100,200,255,0.15); border-color:#6cf; box-shadow:0 0 30px rgba(100,200,255,0.4); }
        /* Кнопка normal */
        #btn-normal { border-color:rgba(0,255,255,0.5); }
        #btn-normal:hover { background:rgba(0,255,255,0.15); border-color:#0ff; box-shadow:0 0 30px rgba(0,255,255,0.4); }
        /* Кнопка limbo */
        #btn-limbo { border-color:rgba(255,100,0,0.5); }
        #btn-limbo:hover { background:rgba(255,100,0,0.15); border-color:#f60; box-shadow:0 0 30px rgba(255,100,0,0.4); }

        .sound-btn {
            position:fixed; bottom:20px; right:20px; z-index:999;
            width:44px; height:44px; border-radius:50%;
            background:rgba(0,0,0,0.8); border:2px solid rgba(255,255,255,0.4);
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; transition:all 0.3s;
            box-shadow:0 0 20px rgba(255,255,255,0.2);
            pointer-events:auto;
            font-size:20px;
        }
        .sound-btn:hover { border-color:#fff; box-shadow:0 0 35px rgba(255,255,255,0.5); }
        .sound-btn.muted { border-color:rgba(255,0,64,0.6); box-shadow:0 0 20px rgba(255,0,64,0.3); }

        @media (max-width:600px) { 
            #ui { padding:6px; } 
            #top,#bottom { flex-direction:column; gap:4px; } 
            .badge { font-size:8px; padding:5px 8px; } 
            #center-msg { font-size:12px; padding:8px 12px; }
            .menu-box { padding:25px 15px; }
            .menu-box h1 { font-size:30px; letter-spacing:8px; }
        }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
    <div id="top">
        <div class="badge" id="status-left">SYS:// OFFLINE</div>
        <div class="badge" id="status-right">TIME:// 0.0s</div>
    </div>
    <div id="center-msg">LIMBO</div>
    <div id="bottom">
        <div class="badge" id="log-area">> READY</div>
        <div class="badge">R · SPACE · ESC</div>
    </div>
</div>

<div class="sound-btn" id="soundBtn" title="Звук">🔊</div>

<div id="menu-overlay">
    <div class="menu-box">
        <h1>LIMBO</h1>
        <div class="sub">MEMORY MODE · 2×4</div>
        <div class="divider"></div>
        <button id="btn-easy">
            <b>🏔 ЛЁГКИЙ · ГОРНЫЙ ПЕЙЗАЖ</b>
            <span>4.2с показ · 10с перемешивание · Медленная орбита</span>
        </button>
        <button id="btn-normal">
            <b>💜 НОРМАЛЬНЫЙ · КИБЕРПАНК</b>
            <span>4.2с показ · 10с перемешивание · Средняя орбита</span>
        </button>
        <button id="btn-limbo">
            <b>💀 LIMBO · ПРЕИСПОДНЯЯ</b>
            <span>4.2с показ · 10с перемешивание · Быстрая орбита</span>
        </button>
        <div class="hint">[ ВЫБЕРИ СЛОЖНОСТЬ ]</div>
    </div>
</div>

<audio id="bgm" preload="auto" loop>
    <source src="LIMBO.mp3" type="audio/mpeg">
</audio>

<script>
(function() {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menu-overlay');
    const statusLeft = document.getElementById('status-left');
    const statusRight = document.getElementById('status-right');
    const centerMsg = document.getElementById('center-msg');
    const logArea = document.getElementById('log-area');
    const bgm = document.getElementById('bgm');
    const soundBtn = document.getElementById('soundBtn');

    const btnEasy = document.getElementById('btn-easy');
    const btnNormal = document.getElementById('btn-normal');
    const btnLimbo = document.getElementById('btn-limbo');

    let W, H;
    let audioReady = false;

    soundBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (bgm.paused) {
            bgm.currentTime = bgm.currentTime || 185;
            bgm.volume = 0.55;
            bgm.play().then(() => {
                soundBtn.textContent = '🔊';
                soundBtn.classList.remove('muted');
            }).catch(() => {});
        } else {
            bgm.pause();
            soundBtn.textContent = '🔇';
            soundBtn.classList.add('muted');
        }
    });

    bgm.addEventListener('canplaythrough', () => { audioReady = true; });
    bgm.addEventListener('error', () => { soundBtn.style.opacity = '0.3'; });

    const CONFIG = {
        easy:   { name:'ЛЁГКИЙ',    reveal:4200, shuffle:10000, beat:500, orbit:0.005, trans:2000 },
        normal: { name:'НОРМАЛЬНЫЙ', reveal:4200, shuffle:10000, beat:350, orbit:0.008, trans:1800 },
        limbo:  { name:'LIMBO',     reveal:4200, shuffle:10000, beat:200, orbit:0.012, trans:1500 }
    };

    // ========== 3 УНИКАЛЬНЫЕ ТЕМЫ ==========
    const THEMES = {
        // 🏔 ГОРНЫЙ ПЕЙЗАЖ — голубое небо, зелёные горы, солнце
        easy: {
            bg:'#1a2a3a',
            // Небо
            skyTop:'#4a90d9', skyBottom:'#87ceeb',
            // Солнце
            sunColor:'#ffdd57', sunGlow:'rgba(255,221,87,0.4)',
            // Горы
            mountains:[
                {color:'#2d5a27', peak:0.45, width:0.5, offset:0.1},
                {color:'#3a7d32', peak:0.55, width:0.6, offset:0.4},
                {color:'#1e4018', peak:0.4, width:0.7, offset:0.7},
                {color:'#4a9e3f', peak:0.5, width:0.4, offset:0.0}
            ],
            // Облака
            cloudColor:'rgba(255,255,255,0.7)',
            // Ячейки
            cellBg:'rgba(255,255,255,0.15)', cellEdge:'rgba(255,255,255,0.8)',
            correctBg:'rgba(76,175,80,0.4)', correctEdge:'#4CAF50',
            wrongBg:'rgba(244,67,54,0.5)', wrongEdge:'#F44336',
            // Эффекты
            scanColor:'rgba(255,255,255,0.2)', ringColor:'rgba(255,255,255,0.3)',
            starColor:'rgba(255,255,255,', hudText:'#ffffff', accent:'#FFD700',
            // Частицы — бабочки/листья
            particleColors:['rgba(255,255,255,','rgba(255,221,87,','rgba(144,238,144,','rgba(135,206,235,'],
            groundColor:'#3a7d32'
        },
        // 💜 КИБЕРПАНК — неон, сетка, тёмные тона
        normal: {
            bg:'#020015',
            cellBg:'rgba(0,245,255,0.1)', cellEdge:'rgba(0,245,255,0.85)',
            correctBg:'rgba(57,255,20,0.4)', correctEdge:'#39FF14',
            wrongBg:'rgba(255,0,64,0.5)', wrongEdge:'#FF0040',
            scanColor:'rgba(0,255,255,0.35)', ringColor:'rgba(0,255,255,0.45)',
            starColor:'rgba(150,220,255,', hudText:'#00FFFF', accent:'#00FFFF',
            particleColors:['rgba(0,255,255,','rgba(255,0,255,','rgba(57,255,20,'],
            gridColor:'rgba(0,255,255,0.05)'
        },
        // 💀 ПРЕИСПОДНЯЯ — лава, черепа, красно-оранжевый
        limbo: {
            bg:'#1a0000',
            // Лава
            lavaColors:['#ff4500','#ff6347','#ff8c00','#ff0000','#ffd700'],
            lavaGlow:'rgba(255,69,0,0.6)',
            // Черепа (ASCII)
            skullChar:'💀',
            // Ячейки
            cellBg:'rgba(255,100,0,0.15)', cellEdge:'rgba(255,140,0,0.85)',
            correctBg:'rgba(255,215,0,0.4)', correctEdge:'#FFD700',
            wrongBg:'rgba(139,0,0,0.6)', wrongEdge:'#8B0000',
            // Эффекты
            scanColor:'rgba(255,69,0,0.4)', ringColor:'rgba(255,100,0,0.5)',
            starColor:'rgba(255,160,80,', hudText:'#FF8C00', accent:'#FF4500',
            particleColors:['rgba(255,69,0,','rgba(255,140,0,','rgba(255,215,0,','rgba(139,0,0,'],
            emberColor:'rgba(255,100,0,0.8)'
        }
    };

    let theme = THEMES.normal;
    let gameStarted = false;

    const S = {
        cfg: CONFIG.normal, phase:'menu', running:false, paused:false,
        cells:[], correctId:null, gridPos:[], tStart:0, tPhase:0, tShuffle:0,
        orbitAngle:0, particles:[], stars:[], scanY:0, shake:0, scanLines:[],
        animId:null, swapTimer:null, boardRX:0, boardRY:0, 
        hexagons:[], diamonds:[], triangles:[],
        clouds:[], skulls:[], lavaDrops:[], mountains:[], snowflakes:[]
    };

    btnEasy.addEventListener('click', (e) => { e.stopPropagation(); startGame('easy'); });
    btnNormal.addEventListener('click', (e) => { e.stopPropagation(); startGame('normal'); });
    btnLimbo.addEventListener('click', (e) => { e.stopPropagation(); startGame('limbo'); });

    function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W; canvas.height = H;
        
        const cols=2, rows=4;
        const tileW = Math.min(120, Math.max(70, W*0.12));
        const tileH = tileW * 0.85;
        const gapX = Math.max(25, tileW*0.35);
        const gapY = Math.max(15, tileH*0.2);
        const bw = cols*tileW + (cols-1)*gapX;
        const bh = rows*tileH + (rows-1)*gapY;
        const bx = (W-bw)/2, by = (H-bh)/2;
        
        S.gridPos = [];
        for(let r=0; r<rows; r++)
            for(let c=0; c<cols; c++)
                S.gridPos.push({x:bx+c*(tileW+gapX), y:by+r*(tileH+gapY), w:tileW, h:tileH});
        
        S.boardRX = Math.min(W,H)*0.38;
        S.boardRY = Math.min(W,H)*0.22;
        
        if(S.cells.length) for(let i=0; i<S.cells.length; i++) { 
            S.cells[i].w=S.gridPos[i].w; S.cells[i].h=S.gridPos[i].h; 
        }
        
        if(!S.stars.length || S.stars.length<80) {
            S.stars=[];
            for(let i=0; i<120; i++) S.stars.push({
                x:Math.random()*W, y:Math.random()*H, 
                r:Math.random()*2.5+0.3, a:Math.random()*0.9+0.1, 
                sp:Math.random()*0.04+0.003, ph:Math.random()*Math.PI*2
            });
        }
        
        // Облака для лёгкого режима
        S.clouds = [];
        for(let i=0; i<6; i++) S.clouds.push({
            x:Math.random()*W, y:20+Math.random()*H*0.3,
            w:60+Math.random()*120, h:20+Math.random()*30,
            sp:0.15+Math.random()*0.3
        });

        // Черепа для LIMBO
        S.skulls = [];
        for(let i=0; i<8; i++) S.skulls.push({
            x:Math.random()*W, y:Math.random()*H,
            size:20+Math.random()*40, sp:0.01+Math.random()*0.03,
            ph:Math.random()*Math.PI*2, alpha:0.08+Math.random()*0.15
        });

        // Лавовые капли для LIMBO
        S.lavaDrops = [];
        for(let i=0; i<25; i++) S.lavaDrops.push({
            x:Math.random()*W, y:Math.random()*H*0.6 + H*0.4,
            r:2+Math.random()*6, sp:0.5+Math.random()*2,
            life:Math.random()*100, maxLife:80+Math.random()*120
        });

        // Горы для лёгкого
        S.mountains = [];
        if(theme.mountains) {
            for(const m of theme.mountains) {
                S.mountains.push({...m});
            }
        }

        S.snowflakes = [];
        for(let i=0; i<30; i++) S.snowflakes.push({
            x:Math.random()*W, y:Math.random()*H,
            r:1+Math.random()*3, sp:0.3+Math.random()*0.8,
            wind:Math.random()*0.5-0.25, alpha:0.4+Math.random()*0.5
        });
    }
    window.addEventListener('resize', resize);

    function log(msg) {
        const lines = logArea.innerHTML.split('<br>');
        lines.push('> '+msg);
        if(lines.length>3) lines.shift();
        logArea.innerHTML = lines.join('<br>');
    }

    function setStatus(l,r,m) {
        statusLeft.textContent=l; statusRight.textContent=r;
        if(m!==undefined) centerMsg.textContent=m;
    }

    function createCells() {
        S.cells=[];
        for(let i=0; i<8; i++) {
            const g=S.gridPos[i];
            S.cells.push({
                id:i, x:g.x, y:g.y, w:g.w, h:g.h, 
                color:theme.cellBg, edge:theme.cellEdge, isCorrect:false, glowPhase:Math.random()*Math.PI*2
            });
        }
        const correctIdx = Math.floor(Math.random()*8);
        S.correctId = S.cells[correctIdx].id;
        S.cells[correctIdx].isCorrect = true;
        S.cells[correctIdx].color = theme.correctBg;
        S.cells[correctIdx].edge = theme.correctEdge;
    }

    function showCorrect(show) {
        S.cells.forEach(c => {
            if(c.isCorrect && show) { c.color = theme.correctBg; c.edge = theme.correctEdge; }
            else if(!c.isCorrect || !show) { c.color = theme.cellBg; c.edge = theme.cellEdge; }
        });
        if(!show) {
            const correctCell = S.cells.find(c => c.isCorrect);
            if(correctCell) { correctCell.color = theme.cellBg; correctCell.edge = theme.cellEdge; }
        }
    }

    function resetCellsToGrid() {
        S.cells.forEach((c,i)=>{ const g=S.gridPos[i]; c.x=g.x; c.y=g.y; });
    }

    function setupAudio() {
        if (!audioReady) { setTimeout(setupAudio, 500); return; }
        try {
            bgm.currentTime = 185;
            bgm.volume = 0.55;
            bgm.play().then(() => {
                soundBtn.textContent = '🔊';
                soundBtn.classList.remove('muted');
            }).catch(() => {
                soundBtn.textContent = '🔇';
                soundBtn.classList.add('muted');
            });
        } catch(e) {}
    }

    function startGame(mode) {
        if(gameStarted) return;
        gameStarted = true;
        
        S.cfg=CONFIG[mode]; theme=THEMES[mode]; S.phase='reveal'; S.running=true; S.paused=false;
        S.particles=[]; S.shake=0; S.scanY=0; S.orbitAngle=0;
        clearTimeout(S.swapTimer);
        resize(); createCells(); resetCellsToGrid();
        S.tStart=performance.now(); S.tPhase=S.tStart;
        
        menuOverlay.classList.add('hidden');
        setupAudio();
        
        setStatus('SYS:// ONLINE','TIME:// 0.0s','ЗАПОМНИ ЯЧЕЙКУ');
        if(!S.animId) S.animId=requestAnimationFrame(loop);
    }

    function scheduleSwap() {
        if(S.phase!=='shuffle') return;
        const now=performance.now();
        if(!S.tShuffle) S.tShuffle=now;
        if(now-S.tShuffle >= S.cfg.shuffle) {
            S.phase='trans'; S.tPhase=now; S.orbitAngle=0;
            setStatus('SYS:// TRANSITION','TIME:// '+((now-S.tStart)/1000).toFixed(1)+'s','ФОРМИРУЮ ОРБИТУ');
            return;
        }
        const a=Math.floor(Math.random()*8); let b=Math.floor(Math.random()*8);
        while(b===a) b=Math.floor(Math.random()*8);
        animateSwap(a,b,Math.max(80,S.cfg.beat*0.7));
        S.swapTimer=setTimeout(scheduleSwap,S.cfg.beat);
    }

    function animateSwap(i,j,dur) {
        const c1=S.cells[i], c2=S.cells[j], x1=c1.x, y1=c1.y, x2=c2.x, y2=c2.y, start=performance.now();
        function step(now) {
            const p=Math.min(1,(now-start)/dur), e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
            c1.x=x1+(x2-x1)*e; c1.y=y1+(y2-y1)*e; c2.x=x2+(x1-x2)*e; c2.y=y2+(y1-y2)*e;
            if(p<1) requestAnimationFrame(step); 
            else { [S.cells[i], S.cells[j]] = [S.cells[j], S.cells[i]]; c1.x=x2; c1.y=y2; c2.x=x1; c2.y=y1; }
        }
        requestAnimationFrame(step);
    }

    function getOrbitPos(i,angle) {
        const cx=W/2, cy=H/2, a=angle+i*Math.PI*2/8;
        return {x:cx+Math.cos(a)*S.boardRX-S.cells[i].w/2, y:cy+Math.sin(a)*S.boardRY-S.cells[i].h/2};
    }

    function updateTransition(now) {
        const p=Math.min(1,(now-S.tPhase)/S.cfg.trans), e=1-Math.pow(1-p,3);
        S.cells.forEach((c,i)=>{ const g=S.gridPos[i], o=getOrbitPos(i,S.orbitAngle); c.x=g.x+(o.x-g.x)*e; c.y=g.y+(o.y-g.y)*e; });
        if(p>=1) {
            S.phase='orbit'; S.tPhase=now;
            setStatus('SYS:// AWAITING INPUT','TIME:// '+((now-S.tStart)/1000).toFixed(1)+'s','ВЫБИРАЙ!');
            spawnBurst(50);
        }
    }

    function updateOrbit() {
        S.orbitAngle+=S.cfg.orbit;
        S.cells.forEach((c,i)=>{ const o=getOrbitPos(i,S.orbitAngle); c.x=o.x; c.y=o.y; });
    }

    canvas.addEventListener('click',function(e) {
        if(!gameStarted||S.phase!=='orbit'||!S.running||S.paused) return;
        const rect=canvas.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
        for(let i=0; i<S.cells.length; i++) {
            const c=S.cells[i];
            if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h) { handlePick(c); return; }
        }
    });

    function handlePick(clickedCell) {
        S.phase='result';
        const correct = clickedCell.id === S.correctId;
        if(correct) {
            clickedCell.color = theme.correctBg; clickedCell.edge = theme.correctEdge;
            centerMsg.textContent = '✔ ДОСТУП РАЗРЕШЁН ✔'; centerMsg.style.color = theme.correctEdge;
            S.shake=8; spawnBurst(70);
        } else {
            clickedCell.color = theme.wrongBg; clickedCell.edge = theme.wrongEdge;
            const correctCell = S.cells.find(c => c.id === S.correctId);
            if(correctCell) { correctCell.color = theme.correctBg; correctCell.edge = theme.correctEdge; }
            centerMsg.textContent = '💀 ДОСТУП ЗАПРЕЩЁН 💀'; centerMsg.style.color = theme.wrongEdge;
            S.shake=18; spawnBurst(35);
        }
    }

    function spawnBurst(n) {
        const cx=W/2, cy=H/2;
        const colors = theme.particleColors || ['rgba(255,255,255,'];
        for(let i=0; i<n; i++) {
            const a=Math.random()*Math.PI*2, s=1.5+Math.random()*5;
            S.particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:30+Math.random()*35,size:1.5+Math.random()*4.5,col:colors[Math.floor(Math.random()*colors.length)]});
        }
    }

    function spawnAmbient() {
        if(Math.random()>0.3) return;
        const colors = theme.particleColors || ['rgba(255,255,255,'];
        S.particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,life:0,max:70+Math.random()*120,size:0.3+Math.random()*3,col:colors[Math.floor(Math.random()*colors.length)]});
    }

    function updateParticles() {
        for(let i=S.particles.length-1; i>=0; i--) {
            const p=S.particles[i]; p.x+=p.vx; p.y+=p.vy; p.life++; p.vx*=0.992; p.vy*=0.992;
            if(p.life>=p.max) S.particles.splice(i,1);
        }
        spawnAmbient();
    }

    // ========== ОТРИСОВКА ФОНА В ЗАВИСИМОСТИ ОТ ТЕМЫ ==========
    function drawBackground(now) {
        const cfg = S.cfg;
        
        if (cfg.name === 'ЛЁГКИЙ') {
            drawMountainLandscape(now);
        } else if (cfg.name === 'LIMBO') {
            drawHellscape(now);
        } else {
            drawCyberpunkBg(now);
        }
    }

    // 🏔 ГОРНЫЙ ПЕЙЗАЖ
    function drawMountainLandscape(now) {
        // Небо — градиент от тёмно-голубого к светло-голубому
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0, theme.skyTop);
        skyGrad.addColorStop(0.6, theme.skyBottom);
        skyGrad.addColorStop(1, theme.groundColor);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // Солнце
        const sunX = W*0.75, sunY = H*0.2;
        const sunGrad = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 80);
        sunGrad.addColorStop(0, '#fff');
        sunGrad.addColorStop(0.3, theme.sunColor);
        sunGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = sunGrad;
        ctx.beginPath(); ctx.arc(sunX, sunY, 80, 0, Math.PI*2); ctx.fill();

        // Горы
        const baseY = H*0.55;
        for(const m of S.mountains) {
            const px = W*m.offset;
            const pw = W*m.width;
            const ph = H*m.peak;
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.moveTo(px-pw/2, baseY);
            ctx.lineTo(px, baseY-ph);
            ctx.lineTo(px+pw/2, baseY);
            ctx.closePath();
            ctx.fill();
            
            // Снежные вершины
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath();
            ctx.moveTo(px-pw*0.12, baseY-ph*0.75);
            ctx.lineTo(px, baseY-ph);
            ctx.lineTo(px+pw*0.12, baseY-ph*0.75);
            ctx.closePath();
            ctx.fill();
        }

        // Земля
        ctx.fillStyle = theme.groundColor;
        ctx.fillRect(0, baseY, W, H-baseY);

        // Облака
        for(const cl of S.clouds) {
            cl.x += cl.sp;
            if(cl.x > W+200) cl.x = -200;
            ctx.fillStyle = theme.cloudColor;
            ctx.beginPath();
            ctx.ellipse(cl.x, cl.y, cl.w/2, cl.h/2, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cl.x-cl.w*0.25, cl.y-cl.h*0.2, cl.w*0.35, cl.h*0.4, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cl.x+cl.w*0.25, cl.y-cl.h*0.15, cl.w*0.3, cl.h*0.35, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // Снежинки
        for(const sf of S.snowflakes) {
            sf.y += sf.sp;
            sf.x += sf.wind;
            if(sf.y > H) { sf.y = -10; sf.x = Math.random()*W; }
            ctx.fillStyle = 'rgba(255,255,255,'+sf.alpha.toFixed(2)+')';
            ctx.beginPath(); ctx.arc(sf.x, sf.y, sf.r, 0, Math.PI*2); ctx.fill();
        }

        // Деревья на переднем плане
        const treePositions = [0.15, 0.35, 0.55, 0.75, 0.9];
        for(const tx of treePositions) {
            const treeX = W*tx;
            const treeY = baseY;
            // Ствол
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(treeX-4, treeY-50, 8, 50);
            // Крона (треугольник)
            ctx.fillStyle = '#2d5a27';
            ctx.beginPath();
            ctx.moveTo(treeX, treeY-80);
            ctx.lineTo(treeX-25, treeY-30);
            ctx.lineTo(treeX+25, treeY-30);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#3a7d32';
            ctx.beginPath();
            ctx.moveTo(treeX, treeY-65);
            ctx.lineTo(treeX-20, treeY-20);
            ctx.lineTo(treeX+20, treeY-20);
            ctx.closePath();
            ctx.fill();
        }
    }

    // 💀 ПРЕИСПОДНЯЯ
    function drawHellscape(now) {
        // Тёмно-красный фон
        const hellGrad = ctx.createRadialGradient(W/2, H*0.6, 0, W/2, H*0.6, Math.max(W,H));
        hellGrad.addColorStop(0, '#2a0000');
        hellGrad.addColorStop(0.5, '#1a0000');
        hellGrad.addColorStop(1, '#000000');
        ctx.fillStyle = hellGrad;
        ctx.fillRect(0, 0, W, H);

        // Лавовые прожилки
        ctx.strokeStyle = 'rgba(255,69,0,0.3)';
        ctx.lineWidth = 2;
        for(let i=0; i<8; i++) {
            ctx.beginPath();
            let lx = Math.random()*W, ly = H;
            ctx.moveTo(lx, ly);
            for(let j=0; j<10; j++) {
                lx += (Math.random()-0.5)*60;
                ly -= 20+Math.random()*40;
                ctx.lineTo(lx, ly);
            }
            ctx.stroke();
        }

        // Лавовые капли
        for(const ld of S.lavaDrops) {
            ld.y += ld.sp;
            ld.life++;
            if(ld.life > ld.maxLife || ld.y > H+50) {
                ld.y = Math.random()*H*0.4 + H*0.6;
                ld.life = 0;
            }
            const alpha = ld.life < ld.maxLife*0.3 ? ld.life/(ld.maxLife*0.3) : 1 - (ld.life-ld.maxLife*0.3)/(ld.maxLife*0.7);
            ctx.fillStyle = theme.emberColor.replace('0.8', Math.max(0,alpha*0.8).toFixed(2));
            ctx.beginPath(); ctx.arc(ld.x, ld.y, ld.r, 0, Math.PI*2); ctx.fill();
        }

        // Черепа на фоне
        for(const sk of S.skulls) {
            sk.ph += sk.sp;
            const alpha = sk.alpha + Math.sin(sk.ph)*0.05;
            ctx.save();
            ctx.globalAlpha = Math.max(0.03, alpha);
            ctx.fillStyle = '#fff';
            ctx.font = sk.size+'px serif';
            ctx.fillText('💀', sk.x, sk.y);
            ctx.restore();
        }

        // Огонь на земле
        const fireBase = H*0.85;
        for(let i=0; i<12; i++) {
            const fx = (W/12)*i + Math.sin(now*0.01+i)*20;
            const fh = 30+Math.abs(Math.sin(now*0.02+i*1.5))*50;
            const fGrad = ctx.createLinearGradient(fx, fireBase, fx, fireBase-fh);
            fGrad.addColorStop(0, 'rgba(255,0,0,0.6)');
            fGrad.addColorStop(0.4, 'rgba(255,140,0,0.4)');
            fGrad.addColorStop(0.7, 'rgba(255,215,0,0.2)');
            fGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = fGrad;
            ctx.beginPath();
            ctx.moveTo(fx-8, fireBase);
            ctx.quadraticCurveTo(fx-15, fireBase-fh*0.7, fx, fireBase-fh);
            ctx.quadraticCurveTo(fx+15, fireBase-fh*0.7, fx+8, fireBase);
            ctx.fill();
        }
    }

    // 💜 КИБЕРПАНК
    function drawCyberpunkBg(now) {
        const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.9);
        bgGrad.addColorStop(0, theme.bg); bgGrad.addColorStop(1, '#000000');
        ctx.fillStyle = bgGrad; ctx.fillRect(0,0,W,H);
        
        // Сетка
        ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.6;
        const step = 30; ctx.beginPath();
        for(let x=0; x<W; x+=step) { ctx.moveTo(x,0); ctx.lineTo(x,H); }
        for(let y=0; y<H; y+=step) { ctx.moveTo(0,y); ctx.lineTo(W,y); }
        ctx.stroke();

        // Звёзды
        for(const s of S.stars) {
            const a=(Math.sin(now*s.sp+s.ph)+1)/2*s.a;
            ctx.fillStyle = theme.starColor + Math.max(0.03,a).toFixed(3)+')';
            ctx.beginPath();
            if(s.r>2) { ctx.arc(s.x,s.y,s.r,0,Math.PI*2); }
            else { ctx.fillRect(s.x-0.5,s.y-0.5,1,1); }
            ctx.fill();
        }
    }

    function drawOrbitRings(now) {
        const cx=W/2, cy=H/2, p=1+Math.sin(now*0.0025)*0.05;
        ctx.save(); 
        ctx.globalAlpha=0.3; ctx.strokeStyle=theme.ringColor; ctx.lineWidth=2;
        ctx.setLineDash([8, 16]);
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*p,S.boardRY*p,0,0,Math.PI*2); ctx.stroke();
        ctx.setLineDash([4, 20]); ctx.globalAlpha=0.22;
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*0.7*p,S.boardRY*0.7*p,0,0,Math.PI*2); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha=0.15;
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*0.4*p,S.boardRY*0.4*p,0,0,Math.PI*2); ctx.stroke();
        
        const cs = 18 + Math.sin(now*0.004)*6;
        ctx.globalAlpha = 0.45; ctx.strokeStyle = theme.hudText; ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 7]);
        ctx.beginPath();
        ctx.moveTo(cx-cs, cy); ctx.lineTo(cx+cs, cy);
        ctx.moveTo(cx, cy-cs); ctx.lineTo(cx, cy+cs);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2);
        ctx.fillStyle = theme.accent; ctx.globalAlpha = 0.7;
        ctx.fill();
        ctx.restore();
    }

    function drawCells() {
        for(const c of S.cells) {
            ctx.save();
            const glowPulse = 1 + Math.sin(performance.now()*0.004 + c.glowPhase)*0.15;
            ctx.shadowBlur = 22 * glowPulse;
            ctx.shadowColor = c.edge;
            ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(c.x+4, c.y+4, c.w, c.h);
            ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, c.w, c.h);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = c.edge; ctx.lineWidth = 2.5; ctx.strokeRect(c.x, c.y, c.w, c.h);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 0.8;
            ctx.strokeRect(c.x+4, c.y+4, c.w-8, c.h-8);
            const grad = ctx.createLinearGradient(c.x, c.y, c.x, c.y+c.h);
            grad.addColorStop(0, 'rgba(255,255,255,0.1)'); grad.addColorStop(0.45, 'rgba(255,255,255,0.02)'); grad.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = grad; ctx.fillRect(c.x, c.y, c.w, c.h);
            const cs2 = 7;
            ctx.strokeStyle = c.edge; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(c.x, c.y+cs2); ctx.lineTo(c.x, c.y); ctx.lineTo(c.x+cs2, c.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x+c.w-cs2, c.y); ctx.lineTo(c.x+c.w, c.y); ctx.lineTo(c.x+c.w, c.y+cs2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x, c.y+c.h-cs2); ctx.lineTo(c.x, c.y+c.h); ctx.lineTo(c.x+cs2, c.y+c.h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x+c.w-cs2, c.y+c.h); ctx.lineTo(c.x+c.w, c.y+c.h); ctx.lineTo(c.x+c.w, c.y+c.h-cs2); ctx.stroke();
            ctx.restore();
        }
    }

    function drawParticles() {
        for(const p of S.particles) {
            const a = 1-p.life/p.max;
            ctx.save(); ctx.globalAlpha = Math.max(0, a);
            ctx.fillStyle = p.col + (a*0.95).toFixed(3)+')';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }
    }

    function drawHUD(now) {
        if(S.phase==='orbit'||S.phase==='trans'||S.phase==='shuffle') {
            const pulse = 0.5+0.5*Math.sin(now*0.0035);
            ctx.save();
            ctx.globalAlpha = 0.12+pulse*0.14;
            ctx.fillStyle = theme.hudText;
            ctx.font = 'bold '+Math.min(46,Math.max(24,W*0.035))+'px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('LIMBO', W/2, H/2+6);
            ctx.restore();
        }
        canvas.style.transform = S.shake>0.1 ? `translate(${(Math.random()-0.5)*S.shake}px,${(Math.random()-0.5)*S.shake}px)` : 'translate(0,0)';
    }

    function loop(now) {
        if(!S.running) { drawBackground(now); updateParticles(); drawParticles(); S.animId = requestAnimationFrame(loop); return; }
        if(!S.paused) {
            const elapsed = (now-S.tStart)/1000;
            if(S.phase==='reveal'&&now-S.tPhase>=S.cfg.reveal) {
                S.phase='shuffle'; S.tPhase=now; S.tShuffle=0; showCorrect(false);
                setStatus('SYS:// SHUFFLING','TIME:// '+elapsed.toFixed(1)+'s','ПЕРЕМЕШИВАНИЕ'); scheduleSwap();
            }
            if(S.phase==='trans') updateTransition(now);
            if(S.phase==='orbit') updateOrbit();
            if(S.shake>0.1) S.shake*=0.86; else S.shake=0;
            updateParticles();
            drawBackground(now); drawOrbitRings(now); drawCells(); drawParticles(); drawHUD(now);
            setStatus(S.phase==='result'?'SYS:// RESULT':'SYS:// ONLINE','TIME:// '+elapsed.toFixed(1)+'s');
        }
        S.animId = requestAnimationFrame(loop);
    }

    window.addEventListener('keydown',function(e) {
        if(e.key==='Escape') { if(document.fullscreenElement) document.exitFullscreen(); return; }
        if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К') { restart(); return; }
        if(e.key===' ') { e.preventDefault(); S.paused=!S.paused; if(S.paused) { bgm.pause(); } else { bgm.play().catch(()=>{}); } }
    });

    function restart() {
        gameStarted = false; S.running=false; S.phase='menu'; S.particles=[]; S.shake=0;
        clearTimeout(S.swapTimer); bgm.pause(); bgm.currentTime=185;
        menuOverlay.classList.remove('hidden');
        setStatus('SYS:// OFFLINE','TIME:// 0.0s','LIMBO');
        canvas.style.transform='translate(0,0)';
    }

    resize(); setStatus('SYS:// OFFLINE','TIME:// 0.0s','LIMBO');
    S.animId = requestAnimationFrame(loop);
})();
</script>
</body>
