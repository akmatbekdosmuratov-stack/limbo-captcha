<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIMBO — Memory Game</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New',monospace; user-select:none; }
        body { display:flex; align-items:center; justify-content:center; }
        canvas { display:block; width:100vw; height:100vh; cursor:pointer; position:fixed; top:0; left:0; z-index:1; }
        #ui { position:fixed; inset:0; pointer-events:none; z-index:10; display:flex; flex-direction:column; justify-content:space-between; padding:15px; }
        #top,#bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        #bottom { align-items:flex-end; }
        .badge { padding:8px 16px; border:1px solid rgba(255,255,255,0.25); background:rgba(10,10,20,0.8); backdrop-filter:blur(12px); color:#ddd; font-size:11px; letter-spacing:2px; border-radius:4px; }
        #center-msg { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; color:#fff; font-size:clamp(12px,2.5vw,20px); font-weight:bold; letter-spacing:5px; text-align:center; padding:12px 28px; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.75); backdrop-filter:blur(16px); border-radius:8px; white-space:nowrap; }
        #menu-overlay { position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); }
        #menu-overlay.hidden { display:none !important; }
        .menu-box { width:90%; max-width:520px; padding:40px 35px; border:1px solid rgba(255,255,255,0.2); background:rgba(15,15,25,0.9); backdrop-filter:blur(20px); text-align:center; border-radius:20px; }
        .menu-box h1 { color:#fff; font-size:clamp(40px,8vw,60px); letter-spacing:18px; margin-bottom:8px; font-weight:300; }
        .menu-box .sub { color:#aaa; font-size:12px; letter-spacing:6px; margin-bottom:30px; }
        .menu-box .divider { width:60%; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); margin:0 auto 25px; }
        .menu-box button { display:block; width:100%; padding:16px 24px; margin:10px 0; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#ddd; font-family:inherit; font-size:15px; cursor:pointer; text-align:left; transition:all 0.3s; border-radius:12px; backdrop-filter:blur(10px); }
        .menu-box button:hover { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.5); transform:translateY(-2px); }
        .menu-box button b { display:block; margin-bottom:4px; color:#fff; font-size:18px; }
        .menu-box button span { display:block; font-size:11px; color:rgba(255,255,255,0.55); }
        .menu-box .hint { margin-top:25px; color:rgba(255,255,255,0.35); font-size:10px; letter-spacing:3px; }
        .sound-btn { position:fixed; bottom:25px; right:25px; z-index:999; width:48px; height:48px; border-radius:50%; background:rgba(10,10,20,0.8); border:1px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:22px; backdrop-filter:blur(12px); transition:0.3s; }
        .sound-btn:hover { border-color:#fff; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
    <div id="top"><div class="badge" id="status-left">◆ SYS OFFLINE</div><div class="badge" id="status-right">⏱ 0.0s</div></div>
    <div id="center-msg">LIMBO</div>
    <div id="bottom"><div class="badge" id="log-area">> READY</div><div class="badge">R · SPACE · ESC</div></div>
</div>
<div class="sound-btn" id="soundBtn">🔊</div>
<div id="menu-overlay">
    <div class="menu-box">
        <h1>LIMBO</h1>
        <div class="sub">Memory Mode · 2×4</div>
        <div class="divider"></div>
        <button id="btn-easy"><b>🏔 ГОРНЫЙ ПЕЙЗАЖ</b><span>4.2с показ · 10с перемешивание · Медленно</span></button>
        <button id="btn-normal"><b>🌃 КИБЕРПАНК</b><span>4.2с показ · 10с перемешивание · Средне</span></button>
        <button id="btn-limbo"><b>💀 ПРЕИСПОДНЯЯ</b><span>4.2с показ · 10с перемешивание · Быстро</span></button>
        <div class="hint">ВЫБЕРИ СЛОЖНОСТЬ</div>
    </div>
</div>
<audio id="bgm" preload="auto" loop><source src="LIMBO.mp3" type="audio/mpeg"></audio>

<script>
(function() {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menu-overlay');
    const statusLeft = document.getElementById('status-left');
    const statusRight = document.getElementById('status-right');
    const centerMsg = document.getElementById('center-msg');
    const logArea = document.getElementById('log-area');
    const bgm = document.getElementById('bgm');
    const soundBtn = document.getElementById('soundBtn');

    let W, H, audioReady = false;
    soundBtn.onclick = (e) => { e.stopPropagation(); if(bgm.paused){ bgm.currentTime=185; bgm.volume=0.55; bgm.play().catch(()=>{}); soundBtn.textContent='🔊'; } else { bgm.pause(); soundBtn.textContent='🔇'; } };
    bgm.oncanplaythrough = () => audioReady = true;

    const CONFIG = {
        easy:   { name:'easy',   reveal:4200, shuffle:10000, beat:500, orbit:0.005, trans:2000 },
        normal: { name:'normal', reveal:4200, shuffle:10000, beat:350, orbit:0.008, trans:1800 },
        limbo:  { name:'limbo',  reveal:4200, shuffle:10000, beat:200, orbit:0.012, trans:1500 }
    };

    const THEMES = {
        easy: {
            cellBg:'rgba(255,255,255,0.12)', cellEdge:'rgba(255,255,255,0.85)',
            correctBg:'rgba(76,175,80,0.5)', correctEdge:'#4CAF50',
            wrongBg:'rgba(244,67,54,0.5)', wrongEdge:'#F44336',
            ringColor:'rgba(255,255,255,0.5)', hudText:'#ffffff', accent:'#FFD700'
        },
        normal: {
            cellBg:'rgba(0,245,255,0.1)', cellEdge:'rgba(0,245,255,0.85)',
            correctBg:'rgba(57,255,20,0.4)', correctEdge:'#39FF14',
            wrongBg:'rgba(255,0,64,0.5)', wrongEdge:'#FF0040',
            ringColor:'rgba(0,255,255,0.5)', hudText:'#00FFFF', accent:'#00FFFF'
        },
        limbo: {
            cellBg:'rgba(255,100,0,0.18)', cellEdge:'rgba(255,140,0,0.9)',
            correctBg:'rgba(255,215,0,0.5)', correctEdge:'#FFD700',
            wrongBg:'rgba(139,0,0,0.6)', wrongEdge:'#8B0000',
            ringColor:'rgba(255,100,0,0.6)', hudText:'#FF8C00', accent:'#FF4500'
        }
    };

    let theme = THEMES.normal, gameStarted = false;
    const S = {
        cfg: CONFIG.normal, phase:'menu', running:false, paused:false,
        cells:[], correctId:null, gridPos:[], tStart:0, tPhase:0, tShuffle:0,
        orbitAngle:0, particles:[], shake:0,
        animId:null, swapTimer:null, boardRX:0, boardRY:0,
        // Элементы для всех тем
        clouds:[], birds:[],
        // Для горного пейзажа
        mountains:[], trees:[], wildflowers:[], river:{}, rocks:[], bushes:[],
        // Киберпанк
        neonSigns:[], rainDrops:[], puddles:[],
        // Преисподняя
        lavaRivers:[], embers:[], skulls:[], ruins:[], smokeParticles:[]
    };

    document.getElementById('btn-easy').onclick = () => startGame('easy');
    document.getElementById('btn-normal').onclick = () => startGame('normal');
    document.getElementById('btn-limbo').onclick = () => startGame('limbo');

    function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W; canvas.height = H;
        const cols=2, rows=4;
        const tileW = Math.min(120, Math.max(70, W*0.12));
        const tileH = tileW * 0.85;
        const gapX = Math.max(25, tileW*0.35);
        const gapY = Math.max(15, tileH*0.2);
        const bw = cols*tileW + (cols-1)*gapX, bh = rows*tileH + (rows-1)*gapY;
        const bx = (W-bw)/2, by = (H-bh)/2;
        S.gridPos = [];
        for(let r=0; r<rows; r++) for(let c=0; c<cols; c++)
            S.gridPos.push({x:bx+c*(tileW+gapX), y:by+r*(tileH+gapY), w:tileW, h:tileH});
        S.boardRX = Math.min(W,H)*0.38;
        S.boardRY = Math.min(W,H)*0.22;
        if(S.cells.length) for(let i=0; i<S.cells.length; i++) { S.cells[i].w=S.gridPos[i].w; S.cells[i].h=S.gridPos[i].h; }

        // Облака и птицы (для всех)
        S.clouds = Array.from({length:8}, () => ({x:Math.random()*W, y:20+Math.random()*H*0.25, w:80+Math.random()*140, sp:0.2+Math.random()*0.4}));
        S.birds = Array.from({length:6}, () => ({x:Math.random()*W, y:30+Math.random()*H*0.2, sp:0.4+Math.random()*0.8, wing:Math.random()*Math.PI*2}));

        // === ГОРНЫЙ ПЕЙЗАЖ ===
        S.mountains = [
            {x:W*0.1, w:W*0.45, h:H*0.35, color:'#4a6741', snow:0.25},
            {x:W*0.5, w:W*0.5, h:H*0.4, color:'#3a5535', snow:0.3},
            {x:W*0.85, w:W*0.4, h:H*0.32, color:'#4a6741', snow:0.2}
        ];
        S.river = {
            points: [],
            // Генерация извилистой реки
            init() {
                this.points = [];
                let x = W*0.2, y = H*0.65;
                for (let i=0; i<20; i++) {
                    this.points.push({x, y});
                    x += (W*0.6/20) + (Math.random()-0.5)*30;
                    y += (H*0.25/20) + (Math.random()-0.5)*15;
                }
            }
        };
        S.river.init();
        S.trees = Array.from({length:12}, () => ({x:Math.random()*W, y:H*0.6+Math.random()*H*0.3, s:0.6+Math.random()*0.8}));
        S.wildflowers = Array.from({length:40}, () => ({
            x:Math.random()*W, y:H*0.65+Math.random()*H*0.3,
            size:2+Math.random()*5,
            color: `hsl(${Math.random()*60+20}, 80%, 60%)`
        }));
        S.rocks = Array.from({length:8}, () => ({x:Math.random()*W, y:H*0.7+Math.random()*H*0.25, r:4+Math.random()*8}));
        S.bushes = Array.from({length:10}, () => ({x:Math.random()*W, y:H*0.68+Math.random()*H*0.28, r:6+Math.random()*12}));

        // Киберпанк и преисподняя (без изменений)
        S.neonSigns = Array.from({length:5}, () => ({x:Math.random()*W, y:20+Math.random()*H*0.5, text:['HOTEL','BAR','OPEN','24H','DATA'][Math.floor(Math.random()*5)], hue:Math.random()*360}));
        S.rainDrops = Array.from({length:150}, () => ({x:Math.random()*W, y:Math.random()*H, sp:8+Math.random()*15, len:10+Math.random()*20}));
        S.puddles = Array.from({length:8}, () => ({x:Math.random()*W, y:H*0.7+Math.random()*H*0.25, w:40+Math.random()*100, h:6+Math.random()*10}));
        S.lavaRivers = Array.from({length:4}, () => ({x:Math.random()*W, w:30+Math.random()*60, amp:20+Math.random()*40}));
        S.embers = Array.from({length:80}, () => ({x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*3, sp:0.5+Math.random()*2, wind:(Math.random()-0.5)*0.4}));
        S.skulls = Array.from({length:12}, () => ({x:Math.random()*W, y:Math.random()*H, size:20+Math.random()*40, rot:Math.random()*Math.PI*2}));
        S.ruins = Array.from({length:6}, () => ({x:Math.random()*W, y:H*0.55+Math.random()*H*0.4, w:30+Math.random()*60, h:40+Math.random()*80}));
        S.smokeParticles = Array.from({length:40}, () => ({x:Math.random()*W, y:H*0.4+Math.random()*H*0.5, r:2+Math.random()*6, sp:0.2+Math.random()*0.6, wind:(Math.random()-0.5)*0.2}));
    }
    window.onresize = resize;

    function log(msg) { const lines = logArea.innerHTML.split('<br>'); lines.push('> '+msg); if(lines.length>3) lines.shift(); logArea.innerHTML = lines.join('<br>'); }
    function setStatus(l,r,m) { statusLeft.textContent=l; statusRight.textContent=r; if(m) centerMsg.textContent=m; }

    function createCells() {
        S.cells = S.gridPos.map((g,i) => ({id:i, x:g.x, y:g.y, w:g.w, h:g.h, color:theme.cellBg, edge:theme.cellEdge, isCorrect:false, gp:Math.random()*Math.PI*2}));
        const idx = Math.floor(Math.random()*8);
        S.correctId = S.cells[idx].id;
        S.cells[idx].isCorrect = true;
        S.cells[idx].color = theme.correctBg;
        S.cells[idx].edge = theme.correctEdge;
    }

    function startGame(mode) {
        if(gameStarted) return;
        gameStarted = true;
        S.cfg = CONFIG[mode]; theme = THEMES[mode];
        S.phase = 'reveal'; S.running = true; S.paused = false;
        S.particles = []; S.shake = 0; S.orbitAngle = 0;
        clearTimeout(S.swapTimer);
        resize(); createCells();
        S.cells.forEach((c,i)=>{ const g=S.gridPos[i]; c.x=g.x; c.y=g.y; });
        S.tStart = performance.now(); S.tPhase = S.tStart;
        menuOverlay.classList.add('hidden');
        if(audioReady) { bgm.currentTime=185; bgm.volume=0.55; bgm.play().catch(()=>{}); }
        setStatus('◆ SYS ONLINE','⏱ 0.0s','ЗАПОМНИ ЯЧЕЙКУ');
        cancelAnimationFrame(S.animId);
        S.animId = requestAnimationFrame(loop);
    }

    function restart() {
        gameStarted = false; S.running = false; S.phase = 'menu';
        S.particles = []; S.shake = 0; clearTimeout(S.swapTimer);
        bgm.pause(); bgm.currentTime=185;
        menuOverlay.classList.remove('hidden');
        theme = THEMES.normal;
        setStatus('◆ SYS OFFLINE','⏱ 0.0s','LIMBO');
        canvas.style.transform = 'translate(0,0)';
    }

    function scheduleSwap() {
        if(S.phase!=='shuffle') return;
        const now=performance.now();
        if(!S.tShuffle) S.tShuffle=now;
        if(now-S.tShuffle >= S.cfg.shuffle) {
            S.phase='trans'; S.tPhase=now; S.orbitAngle=0;
            setStatus('SYS:// TRANSITION','TIME:// '+((now-S.tStart)/1000).toFixed(1)+'s','ФОРМИРУЮ ОРБИТУ');
            return;
        }
        const a=Math.floor(Math.random()*8); let b=Math.floor(Math.random()*8);
        while(b===a) b=Math.floor(Math.random()*8);
        animateSwap(a,b,Math.max(80,S.cfg.beat*0.7));
        S.swapTimer=setTimeout(scheduleSwap,S.cfg.beat);
    }

    function animateSwap(i,j,dur) {
        const c1=S.cells[i], c2=S.cells[j], x1=c1.x, y1=c1.y, x2=c2.x, y2=c2.y, start=performance.now();
        function step(now) {
            const p=Math.min(1,(now-start)/dur), e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
            c1.x=x1+(x2-x1)*e; c1.y=y1+(y2-y1)*e; c2.x=x2+(x1-x2)*e; c2.y=y2+(y1-y2)*e;
            if(p<1) requestAnimationFrame(step); 
            else { [S.cells[i], S.cells[j]] = [S.cells[j], S.cells[i]]; c1.x=x2; c1.y=y2; c2.x=x1; c2.y=y1; }
        }
        requestAnimationFrame(step);
    }

    function getOrbitPos(i,angle) {
        const cx=W/2, cy=H/2, a=angle+i*Math.PI*2/8;
        return {x:cx+Math.cos(a)*S.boardRX-S.cells[i].w/2, y:cy+Math.sin(a)*S.boardRY-S.cells[i].h/2};
    }

    function updateTransition(now) {
        const p=Math.min(1,(now-S.tPhase)/S.cfg.trans), e=1-Math.pow(1-p,3);
        S.cells.forEach((c,i)=>{ const g=S.gridPos[i], o=getOrbitPos(i,S.orbitAngle); c.x=g.x+(o.x-g.x)*e; c.y=g.y+(o.y-g.y)*e; });
        if(p>=1) {
            S.phase='orbit'; S.tPhase=now;
            setStatus('SYS:// AWAITING INPUT','TIME:// '+((now-S.tStart)/1000).toFixed(1)+'s','ВЫБИРАЙ!');
            spawnBurst(50);
        }
    }

    function updateOrbit() {
        S.orbitAngle+=S.cfg.orbit;
        S.cells.forEach((c,i)=>{ const o=getOrbitPos(i,S.orbitAngle); c.x=o.x; c.y=o.y; });
    }

    canvas.addEventListener('click',function(e) {
        if(!gameStarted||S.phase!=='orbit'||!S.running||S.paused) return;
        const rect=canvas.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
        for(let i=0; i<S.cells.length; i++) {
            const c=S.cells[i];
            if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h) { handlePick(c); return; }
        }
    });

    function handlePick(clickedCell) {
        S.phase='result';
        const correct = clickedCell.id === S.correctId;
        if(correct) {
            clickedCell.color = theme.correctBg; clickedCell.edge = theme.correctEdge;
            centerMsg.textContent = '✔ ДОСТУП РАЗРЕШЁН ✔'; centerMsg.style.color = theme.correctEdge;
            S.shake=8; spawnBurst(70);
        } else {
            clickedCell.color = theme.wrongBg; clickedCell.edge = theme.wrongEdge;
            const correctCell = S.cells.find(c => c.id === S.correctId);
            if(correctCell) { correctCell.color = theme.correctBg; correctCell.edge = theme.correctEdge; }
            centerMsg.textContent = '💀 ДОСТУП ЗАПРЕЩЁН 💀'; centerMsg.style.color = theme.wrongEdge;
            S.shake=18; spawnBurst(35);
        }
    }

    function spawnBurst(n) {
        const cx=W/2, cy=H/2;
        for(let i=0; i<n; i++) {
            const a=Math.random()*Math.PI*2, s=1.5+Math.random()*5;
            S.particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:30+Math.random()*35,size:1.5+Math.random()*4.5});
        }
    }

    function updateParticles() {
        for(let i=S.particles.length-1; i>=0; i--) {
            const p=S.particles[i]; p.x+=p.vx; p.y+=p.vy; p.life++; p.vx*=0.992; p.vy*=0.992;
            if(p.life>=p.max) S.particles.splice(i,1);
        }
    }

    function drawBackground(now) {
        if (!S.cfg || !S.cfg.name) return;
        try {
            if (S.cfg.name === 'easy') drawAlpine(now);
            else if (S.cfg.name === 'limbo') drawUnderworld(now);
            else drawCyberpunk(now);
        } catch (e) {
            ctx.fillStyle = '#111';
            ctx.fillRect(0,0,W,H);
        }
    }

    // === НОВЫЙ РЕАЛИСТИЧНЫЙ ГОРНЫЙ ПЕЙЗАЖ ===
    function drawAlpine(now) {
        // Небо с золотистым оттенком
        const skyGrad = ctx.createLinearGradient(0,0,0,H);
        skyGrad.addColorStop(0,'#3a6186');
        skyGrad.addColorStop(0.4,'#89aed0');
        skyGrad.addColorStop(0.8,'#f7e8c0');
        skyGrad.addColorStop(1,'#e0c982');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0,0,W,H);

        // Солнце с лучами
        const sunX = W*0.8, sunY = H*0.25;
        ctx.save();
        ctx.globalAlpha = 0.25;
        for (let i=0; i<12; i++) {
            const angle = i*Math.PI/6;
            const dx = Math.cos(angle)*60, dy = Math.sin(angle)*60;
            ctx.beginPath();
            ctx.moveTo(sunX+dx*0.3, sunY+dy*0.3);
            ctx.lineTo(sunX+dx, sunY+dy);
            ctx.strokeStyle = '#fff9c4';
            ctx.lineWidth = 4;
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fffde7';
        ctx.beginPath(); ctx.arc(sunX, sunY, 25, 0, Math.PI*2); ctx.fill();

        // Горы
        if (S.mountains) S.mountains.forEach(m => {
            // тело горы
            ctx.fillStyle = m.color;
            ctx.beginPath(); ctx.moveTo(m.x-m.w/2, H*0.65); ctx.lineTo(m.x, H*0.65-m.h); ctx.lineTo(m.x+m.w/2, H*0.65); ctx.closePath(); ctx.fill();
            // снежная шапка
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath(); ctx.moveTo(m.x-m.w*0.12, H*0.65-m.h*0.75); ctx.lineTo(m.x, H*0.65-m.h); ctx.lineTo(m.x+m.w*0.12, H*0.65-m.h*0.75); ctx.closePath(); ctx.fill();
            // туман у подножия
            ctx.fillStyle = 'rgba(200,210,220,0.18)';
            ctx.fillRect(m.x-m.w/2, H*0.65-20, m.w, 40);
        });

        // Река
        if (S.river && S.river.points.length) {
            ctx.beginPath();
            ctx.moveTo(S.river.points[0].x, S.river.points[0].y);
            for (let i=1; i<S.river.points.length; i++) {
                ctx.lineTo(S.river.points[i].x, S.river.points[i].y);
            }
            ctx.strokeStyle = '#5b9bd5';
            ctx.lineWidth = 18;
            ctx.stroke();
            // отражение неба
            ctx.strokeStyle = 'rgba(180,210,240,0.4)';
            ctx.lineWidth = 22;
            ctx.stroke();
        }

        // Поляна с цветами
        if (S.wildflowers) S.wildflowers.forEach(f => {
            ctx.fillStyle = f.color;
            ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(f.x, f.y, f.size*0.4, 0, Math.PI*2); ctx.fill();
        });

        // Камни
        if (S.rocks) S.rocks.forEach(r => {
            ctx.fillStyle = '#7a8a7a';
            ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r*0.7, 0.2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#9eae9e';
            ctx.beginPath(); ctx.ellipse(r.x-1, r.y-1, r.r*0.7, r.r*0.5, 0.2, 0, Math.PI*2); ctx.fill();
        });

        // Кустарники
        if (S.bushes) S.bushes.forEach(b => {
            ctx.fillStyle = '#2e5a1e';
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#4a7a3a';
            ctx.beginPath(); ctx.arc(b.x+2, b.y-2, b.r*0.8, 0, Math.PI*2); ctx.fill();
        });

        // Облака
        if (S.clouds) S.clouds.forEach(c => {
            c.x += c.sp;
            if(c.x > W+200) c.x = -200;
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w/2, c.h/2, 0, 0, Math.PI*2); ctx.fill();
        });

        // Птицы
        if (S.birds) S.birds.forEach(b => {
            b.x += b.sp;
            if(b.x>W+50) b.x=-50;
            b.wing+=0.08;
            const wy = Math.sin(b.wing)*6;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(b.x-8, b.y-wy);
            ctx.quadraticCurveTo(b.x-4, b.y-8, b.x, b.y);
            ctx.quadraticCurveTo(b.x+4, b.y-8, b.x+8, b.y-wy);
            ctx.stroke();
        });
    }

    function drawCyberpunk(now) {
        ctx.fillStyle = '#0a0a14'; ctx.fillRect(0,0,W,H);
        if (S.rainDrops) S.rainDrops.forEach(d => { d.y += d.sp; if(d.y > H) { d.y = -20; d.x = Math.random()*W; } ctx.strokeStyle='rgba(0,255,255,0.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x-1, d.y+d.len); ctx.stroke(); });
        if (S.puddles) S.puddles.forEach(p => { ctx.fillStyle='rgba(0,255,255,0.15)'; ctx.fillRect(p.x, p.y, p.w, p.h); });
        if (S.neonSigns) S.neonSigns.forEach(s => { ctx.fillStyle=`hsl(${s.hue},100%,60%)`; ctx.font='bold 16px "Courier New"'; ctx.fillText(s.text, s.x, s.y); });
    }

    function drawUnderworld(now) {
        ctx.fillStyle = '#1a0000'; ctx.fillRect(0,0,W,H);
        if (S.lavaRivers) S.lavaRivers.forEach(r => { ctx.fillStyle='#ff4500'; ctx.beginPath(); ctx.moveTo(r.x, H); for(let i=0;i<20;i++){ ctx.lineTo(r.x+Math.sin(i*0.5+now*0.01)*r.amp, H-i*(H/20)); } ctx.lineTo(r.x+r.w, H); ctx.fill(); });
        if (S.skulls) S.skulls.forEach(s => { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.font=`${s.size}px serif`; ctx.fillText('💀',0,0); ctx.restore(); });
        if (S.ruins) S.ruins.forEach(r => { ctx.fillStyle='#2a1a1a'; ctx.fillRect(r.x, r.y, r.w, r.h); });
        if (S.smokeParticles) S.smokeParticles.forEach(p => { p.y-=p.sp; p.x+=p.wind; if(p.y<0){p.y=H*0.8; p.x=Math.random()*W;} ctx.fillStyle='rgba(50,50,50,0.4)'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
        if (S.embers) S.embers.forEach(e => { e.y+=e.sp; e.x+=e.wind; if(e.y>H){e.y=H*0.6; e.x=Math.random()*W;} ctx.fillStyle='rgba(255,120,0,0.8)'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill(); });
    }

    function drawOrbitRings(now) {
        const cx=W/2, cy=H/2, p=1+Math.sin(now*0.0025)*0.05;
        ctx.save(); 
        ctx.globalAlpha=0.3; ctx.strokeStyle=theme.ringColor; ctx.lineWidth=2;
        ctx.setLineDash([8, 16]);
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*p,S.boardRY*p,0,0,Math.PI*2); ctx.stroke();
        ctx.setLineDash([4, 20]); ctx.globalAlpha=0.22;
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*0.7*p,S.boardRY*0.7*p,0,0,Math.PI*2); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha=0.15;
        ctx.beginPath(); ctx.ellipse(cx,cy,S.boardRX*0.4*p,S.boardRY*0.4*p,0,0,Math.PI*2); ctx.stroke();
        const cs = 18 + Math.sin(now*0.004)*6;
        ctx.globalAlpha = 0.45; ctx.strokeStyle = theme.hudText; ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 7]);
        ctx.beginPath(); ctx.moveTo(cx-cs, cy); ctx.lineTo(cx+cs, cy); ctx.moveTo(cx, cy-cs); ctx.lineTo(cx, cy+cs); ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fillStyle = theme.accent; ctx.fill();
        ctx.restore();
    }

    function drawCells() {
        for(const c of S.cells) {
            ctx.save();
            const gp = 1 + Math.sin(performance.now()*0.004 + c.gp)*0.15;
            ctx.shadowBlur = 22 * gp; ctx.shadowColor = c.edge;
            ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(c.x+4, c.y+4, c.w, c.h);
            ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, c.w, c.h);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = c.edge; ctx.lineWidth = 2.5; ctx.strokeRect(c.x, c.y, c.w, c.h);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 0.8; ctx.strokeRect(c.x+4, c.y+4, c.w-8, c.h-8);
            const grad = ctx.createLinearGradient(c.x, c.y, c.x, c.y+c.h);
            grad.addColorStop(0, 'rgba(255,255,255,0.1)'); grad.addColorStop(0.45, 'rgba(255,255,255,0.02)'); grad.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = grad; ctx.fillRect(c.x, c.y, c.w, c.h);
            const cs2 = 7;
            ctx.strokeStyle = c.edge; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(c.x, c.y+cs2); ctx.lineTo(c.x, c.y); ctx.lineTo(c.x+cs2, c.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x+c.w-cs2, c.y); ctx.lineTo(c.x+c.w, c.y); ctx.lineTo(c.x+c.w, c.y+cs2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x, c.y+c.h-cs2); ctx.lineTo(c.x, c.y+c.h); ctx.lineTo(c.x+cs2, c.y+c.h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x+c.w-cs2, c.y+c.h); ctx.lineTo(c.x+c.w, c.y+c.h); ctx.lineTo(c.x+c.w, c.y+c.h-cs2); ctx.stroke();
            ctx.restore();
        }
    }

    function drawParticles() {
        for(const p of S.particles) {
            const a = 1-p.life/p.max;
            ctx.save(); ctx.globalAlpha = Math.max(0, a);
            ctx.fillStyle = 'rgba(255,255,255,'+(a*0.8).toFixed(3)+')';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }
    }

    function drawHUD(now) {
        if(S.phase==='orbit'||S.phase==='trans'||S.phase==='shuffle') {
            const pulse = 0.5+0.5*Math.sin(now*0.0035);
            ctx.save(); ctx.globalAlpha = 0.12+pulse*0.14;
            ctx.fillStyle = theme.hudText;
            ctx.font = 'bold '+Math.min(46,Math.max(24,W*0.035))+'px "Courier New"';
            ctx.textAlign = 'center'; ctx.fillText('LIMBO', W/2, H/2+6);
            ctx.restore();
        }
        canvas.style.transform = S.shake>0.1 ? `translate(${(Math.random()-0.5)*S.shake}px,${(Math.random()-0.5)*S.shake}px)` : 'translate(0,0)';
    }

    function loop(now) {
        if(!S.running) { 
            drawBackground(now); updateParticles(); drawParticles(); 
            S.animId = requestAnimationFrame(loop); return; 
        }
        if(!S.paused) {
            const elapsed = (now-S.tStart)/1000;
            if(S.phase==='reveal'&&now-S.tPhase>=S.cfg.reveal) {
                S.phase='shuffle'; S.tPhase=now; S.tShuffle=0; showCorrect(false);
                setStatus('SYS:// SHUFFLING','TIME:// '+elapsed.toFixed(1)+'s','ПЕРЕМЕШИВАНИЕ'); scheduleSwap();
            }
            if(S.phase==='trans') updateTransition(now);
            if(S.phase==='orbit') updateOrbit();
            if(S.shake>0.1) S.shake*=0.86; else S.shake=0;
            updateParticles();
            drawBackground(now); drawOrbitRings(now); drawCells(); drawParticles(); drawHUD(now);
            setStatus(S.phase==='result'?'SYS:// RESULT':'SYS:// ONLINE','TIME:// '+elapsed.toFixed(1)+'s');
        }
        S.animId = requestAnimationFrame(loop);
    }

    function showCorrect(show) {
        S.cells.forEach(c => {
            if(c.isCorrect && show) { c.color = theme.correctBg; c.edge = theme.correctEdge; }
            else if(!c.isCorrect || !show) { c.color = theme.cellBg; c.edge = theme.cellEdge; }
        });
    }

    window.addEventListener('keydown',function(e) {
        if(e.key==='Escape') { if(document.fullscreenElement) document.exitFullscreen(); return; }
        if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К') { restart(); return; }
        if(e.key===' ') { e.preventDefault(); S.paused=!S.paused; if(S.paused) bgm.pause(); else bgm.play().catch(()=>{}); }
    });

    resize(); setStatus('◆ SYS OFFLINE','⏱ 0.0s','LIMBO');
    S.animId = requestAnimationFrame(loop);
})();
</script>
</body>
